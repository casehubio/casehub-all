        run: |
          TMPDIR=$(mktemp -d)
          curl -sf "$CI_DASHBOARD_URL/progress" > "$TMPDIR/old.json" 2>/dev/null || echo '{}' > "$TMPDIR/old.json"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 -c "
          import json
          old = json.load(open('$TMPDIR/old.json'))
          history = old.get('history', [])
          prev = old.get('current')
          if prev and prev.get('run_id') and prev['run_id'] != ${GITHUB_RUN_ID}:
              phases = prev.get('phases', [])
              failed = [p['name'] for p in phases if p.get('status') == 'failure']
              entry = dict(prev, conclusion='failure' if failed else 'success', ended='$NOW',
                  total_tests=sum(p.get('tests_run',0) for p in phases),
                  total_modules=sum(p.get('modules',0) for p in phases), phases=phases)
              history.insert(0, entry)
          phases = ['Prepare + Platform base','Platform A','Platform B','Platform C','Platform D','Platform convergence','ledger','eidos','connectors','worker','pages','neocortex','qhorus','work','engine','ras','desiredstate','claudony','agency','casehub-langchain4j','workers','ops','casehub-mosaic','drafthouse','life','iot','quarkmind','devtown','aml','soc','chat-app','clinical','openclaw','scaffold','fsitrading']
          data = {'current':{'run_id':${GITHUB_RUN_ID},'run_url':'$RUN_URL','commit':'${GITHUB_SHA:0:7}','started':'$NOW','resume_from':'${{ inputs.resume_from }}','phases':[{'name':p,'status':'pending'} for p in phases]},'history':history[:200],'_archives':old.get('_archives',[])}
          json.dump(data, open('$TMPDIR/body.json','w'))
          " 2>/dev/null
          [ -f "$TMPDIR/body.json" ] && curl -sf -X PUT "$CI_DASHBOARD_URL/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Init: true" \
            -d @"$TMPDIR/body.json" > /dev/null || true
          rm -rf "$TMPDIR"
        continue-on-error: true
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != '' && inputs.submodule_update != 'pinned'
        run: |
          for repo in scaffold fsitrading; do git submodule update --remote "$repo"; done
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: |
          # Preserve npm artifact containers — they don't change between levels
          mv ~/.m2/repository/io/casehub/casehub-pages-npm /tmp/casehub-pages-npm 2>/dev/null || true
          mv ~/.m2/repository/io/casehub/casehub-mosaic-npm /tmp/casehub-mosaic-npm 2>/dev/null || true
          rm -rf ~/.m2/repository/io/casehub
          mkdir -p ~/.m2/repository/io/casehub
          mv /tmp/casehub-pages-npm ~/.m2/repository/io/casehub/ 2>/dev/null || true
          mv /tmp/casehub-mosaic-npm ~/.m2/repository/io/casehub/ 2>/dev/null || true
      - run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: ${{ inputs.resume_from != '' }}
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Build
        run: |
          for repo in scaffold fsitrading; do
            bash docs/run-with-progress.sh --parallel "$repo" mvn install -fae -T 1C -f $repo/pom.xml $MVN_COMMON $MAVEN_ARGS
          done
        timeout-minutes: 30

  # ════════════════════════════════════════════════════════════════════
  # Finalize — dashboard + pointer advance
  # ════════════════════════════════════════════════════════════════════
  finalize:
    name: "Finalize"
    needs: [prepare, convergence, level1, level2, level3, level4, level5, level6, level7, level8, level9]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              [ -d "$repo" ] && git submodule update --remote "$repo"
            done
          fi
        timeout-minutes: 5
      - name: Compute build result
        id: result
        if: always()
        run: |
          BUILD_OK=true
          for result in "${{ needs.prepare.result }}" "${{ needs.convergence.result }}" "${{ needs.level1.result }}" "${{ needs.level2.result }}" "${{ needs.level3.result }}" "${{ needs.level4.result }}" "${{ needs.level5.result }}" "${{ needs.level6.result }}" "${{ needs.level7.result }}" "${{ needs.level8.result }}" "${{ needs.level9.result }}"; do
            if [ "$result" = "failure" ]; then
              BUILD_OK=false
              break
            fi
          done
          echo "build_ok=$BUILD_OK" >> "$GITHUB_OUTPUT"
          echo "Build result: $BUILD_OK"
      - name: Finalize CI dashboard
        if: always()
        run: |
          if [ "${{ steps.result.outputs.build_ok }}" = "true" ]; then
            bash docs/update-progress.sh finish success || true
          else
            bash docs/update-progress.sh finish failure || true
          fi
      - name: Advance submodule pointers
        if: steps.result.outputs.build_ok == 'true'
        run: |
          git checkout HEAD -- agency workers
          git add -u
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git pull --rebase origin main || true
            git push
          }
      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ steps.result.outputs.build_ok }}" = "true" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Auto-retry on transient failure
        if: steps.result.outputs.build_ok != 'true' && inputs.retry_count < 2
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RETRY=$(( ${{ inputs.retry_count }} + 1 ))
          echo "::warning::Build failed (attempt $RETRY/2). Dispatching retry — warm cache will cover previously downloaded deps."
          gh workflow run mvn-all.yml \
            -f test_mode=${{ inputs.test_mode }} \
            -f submodule_update=${{ inputs.submodule_update }} \
            -f submodule_list="${{ inputs.submodule_list }}" \
            -f retry_count="$RETRY"
