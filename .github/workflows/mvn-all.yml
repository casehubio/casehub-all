name: Maven All

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "dry = POM validate only (no compile), skip = compile (no tests), run = compile + test"
        type: choice
        options:
          - dry
          - skip
          - compile
          - run
        default: skip
      quarkus_build:
        description: "Run Quarkus augmentation (produces runner JARs)"
        type: boolean
        default: false
      enforcer:
        description: "Run Maven enforcer plugin"
        type: boolean
        default: false
      maven_args:
        description: "Extra Maven args (escape hatch)"
        type: string
        default: ''
      resume_from:
        description: "Resume from level. Skips earlier levels — uses .m2 cache."
        type: choice
        options:
          - ''
          - L1
          - L2
          - L3
          - L4
          - L7
        default: ''
      submodule_update:
        description: "pinned = use committed SHAs, all = pull latest main for all repos, list = pull latest only for named repos"
        type: choice
        options:
          - pinned
          - all
          - list
        default: pinned
      submodule_list:
        description: "Comma-separated repo names to update (only when submodule_update=list)"
        type: string
        default: ''
      if_running:
        description: "If a build is already running: cancel_existing = stop it and start this one, abort = cancel this run instead"
        type: choice
        options:
          - abort
          - cancel_existing
        default: abort
      retry_count:
        description: "Auto-retry counter (0 = first attempt, max 2 retries)"
        type: number
        default: 0

concurrency:
  group: mvn-all
  cancel-in-progress: ${{ inputs.if_running == 'cancel_existing' }}

permissions:
  contents: write
  packages: read
  actions: write

env:
  RESUME_FROM: ${{ inputs.resume_from }}
  CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
  MAVEN_OPTS: '-Xmx4g'
  DRY_RUN: ${{ inputs.test_mode == 'dry' }}

# Architecture: dependency-optimized parallel pipeline (10 levels)
#
# L0:   prepare (platform)
# L1:   [ledger+eidos] | connectors | [worker+pages] | qhorus-api
# L2:   neocortex | qhorus | work  (work parallel with qhorus thanks to qhorus-api at L1)
# L3:   engine
# L4:   [ras+desiredstate] | claudony | agency | [langchain4j+workers]
# L5:   ops | mosaic
# L6:   drafthouse
# L7:   life | iot | quarkmind | [devtown+aml+soc] | [chat-app+clinical+openclaw]
# L8:   [scaffold+fsitrading]
# fin:  dashboard finish + pointer advance

jobs:

  # Gate: abort this run if another is already in progress (default)
  gate:
    name: "Concurrency gate"
    runs-on: ubuntu-latest
    steps:
      - name: Check for in-progress runs
        if: inputs.if_running == 'abort'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PROGRESS=$(gh api repos/${{ github.repository }}/actions/workflows/mvn-all.yml/runs \
            --jq '[.workflow_runs[] | select(.status == "in_progress" and .id != '${{ github.run_id }}')] | length')
          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "::error::Another mvn-all run is already in progress. This run will be cancelled (if_running=abort)."
            gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
            sleep 5
            exit 1
          fi
          echo "No other runs in progress — proceeding."

  # Dependency cache — download all third-party deps once, cache between runs
  warm-cache:
    name: "Warm dependency cache"
    needs: [gate]
    if: ${{ !failure() && !cancelled() && inputs.resume_from == '' && inputs.test_mode != 'dry' }}
    runs-on: ubuntu-latest
    # Dynamic slicing puts 124 modules in platform base (was 3 static).
    # Warm cache downloads third-party deps in parallel. 35 min timeout.
    timeout-minutes: 35
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - if: inputs.test_mode != 'dry'
        uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore dependency cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-
      - name: Verify and complete dependencies
        id: download
        if: steps.cache-restore.outputs.cache-hit != 'true'
        timeout-minutes: 20
        continue-on-error: true
        run: |
          START=$(date +%s)
          CACHE_SIZE_BEFORE=$(du -s ~/.m2/repository 2>/dev/null | cut -f1 || echo 0)
          echo "Cache MISS — downloading dependencies..."
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
          mvn dependency:go-offline -f parent/pom.xml --batch-mode -ntp || true
          for repo in $(python3 -c "import yaml;_p=yaml.safe_load(open('docs/pipeline.yaml'));print(' '.join(sorted(set(r for _l in _p['levels'] for r in (_l.get('repos') or [n for _s in _l['stacks'] for n in _s])))))"); do
            if [ -f "$repo/pom.xml" ]; then
              ( mvn dependency:go-offline io.quarkus:quarkus-maven-plugin:3.39.3:go-offline -f "$repo/pom.xml" --batch-mode -ntp -q 2>/dev/null || mvn dependency:go-offline -f "$repo/pom.xml" --batch-mode -ntp -q 2>/dev/null; echo "  ✓ $repo" ) &
            fi
          done
          wait
          ELAPSED=$(( $(date +%s) - START ))
          CACHE_SIZE_AFTER=$(du -s ~/.m2/repository 2>/dev/null | cut -f1 || echo 0)
          DELTA=$(( CACHE_SIZE_AFTER - CACHE_SIZE_BEFORE ))
          echo "Dependencies resolved — $(du -sh ~/.m2/repository | cut -f1) in ${ELAPSED}s (delta: ${DELTA}KB)"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "delta=$DELTA" >> "$GITHUB_OUTPUT"
      - name: Check offline safety — version divergence
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          echo "Scanning for deps where managed version ≠ natural version..."
          DIVERGED=$(mvn dependency:tree -f platform/pom.xml --batch-mode -ntp -Dverbose 2>&1 | grep -oP '\S+:\S+:jar:\S+:\S+ \(version managed from \S+\)' | while read -r line; do
            managed=$(echo "$line" | grep -oP 'jar:\K[^:]+')
            natural=$(echo "$line" | grep -oP 'from \K\S+' | tr -d ')')
            if [ "$managed" != "$natural" ]; then
              artifact=$(echo "$line" | grep -oP '^\S+:\S+')
              echo "  $artifact: BOM=$managed, natural=$natural — add to parent BOM at $natural"
            fi
          done | sort -u || true)
          if [ -n "$DIVERGED" ]; then
            echo "::warning::Version divergence detected — may affect annotation processor resolution."
            echo "$DIVERGED"
          else
            echo "✓ No version divergence"
          fi
      - name: Save dependency cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
      - name: Report cache status
        if: always()
        run: |
          DELTA="${{ steps.download.outputs.delta }}"
          if [ "${DELTA:-0}" -gt 10240 ]; then
            echo "::notice::Cache grew by ${DELTA}KB — was incomplete, now saved for next run"
          else
            echo "::notice::Cache verified — delta ${DELTA:-0}KB"
          fi

  # Config: always runs (even on resume), reads pipeline.yaml, outputs matrices
  config:
    name: "Build config"
    needs: [gate]
    if: always() && !cancelled() && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
      matrices: ${{ steps.matrices.outputs.matrices }}
      timeouts: ${{ steps.matrices.outputs.timeouts }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/pipeline.yaml
            docs/compute-matrices.py
            docs/compute-mvn-flags.sh
          sparse-checkout-cone-mode: false
      - name: Compute matrices from pipeline.yaml
        id: matrices
        run: python3 docs/compute-matrices.py >> "$GITHUB_OUTPUT"
      - name: Compute Maven flags
        id: flags
        run: bash docs/compute-mvn-flags.sh "${{ inputs.test_mode }}" "${{ inputs.quarkus_build }}" "${{ inputs.enforcer }}" "${{ inputs.maven_args }}"

  # Phase 0: Prepare — checkout, submodule update, platform base
  prepare:
    name: "Prepare + Platform base"
    needs: [gate, warm-cache]
    if: ${{ always() && !cancelled() && needs.gate.result == 'success' && inputs.resume_from == '' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      DRY_RUN: ${{ inputs.test_mode == 'dry' }}
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      # Shallow checkout without submodules — only init what this step needs
      # (parent + platform). Full recursive checkout was 65s for 30+ repos
      # that prepare never touches.
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Init submodules
        run: |
          git submodule update --init --depth=1 parent platform
          # Full init only when submodule_update needs all repos
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            git submodule update --init --depth=1
          fi

      - name: Initialize CI dashboard
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sf "$CI_DASHBOARD_URL/progress" 2>/dev/null > /tmp/old-progress.json || echo '{}' > /tmp/old-progress.json
          python3 docs/init-dashboard-full.py \
            --run-id $GITHUB_RUN_ID \
            --run-url "$RUN_URL" \
            --commit "${GITHUB_SHA:0:7}" \
            --resume-from "${{ inputs.resume_from }}" \
            --retry-count ${{ inputs.retry_count || 0 }} \
            --pipeline docs/pipeline.yaml \
            --old-progress /tmp/old-progress.json \
            > /tmp/dashboard-init.json
          echo "Dashboard payload: $(wc -c < /tmp/dashboard-init.json) bytes"
          curl -sf -X PUT "$CI_DASHBOARD_URL/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -H "X-Init: true" \
            -d @/tmp/dashboard-init.json \
            && echo "::notice::Dashboard: https://casehub.org/casehub-all/" \
            || echo "::warning::Dashboard init PUT failed (exit $?)"
        continue-on-error: true

      - name: Check dependency graph for cycles
        run: python3 docs/check-cycles.py

      - name: Validate pipeline consistency
        run: python3 docs/check-pipeline-consistency.py || echo "::warning::Pipeline consistency check found issues"
        continue-on-error: true

      - name: Update submodules
        run: bash docs/update-submodules.sh "${{ inputs.submodule_update }}" "${{ inputs.submodule_list }}"
        timeout-minutes: 5

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 22
        if: inputs.test_mode != 'dry'
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        if: inputs.test_mode != 'dry'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-

      - name: Configure Maven flags
        id: flags
        run: bash docs/compute-mvn-flags.sh --env "${{ inputs.test_mode }}" "${{ inputs.quarkus_build }}" "${{ inputs.enforcer }}" "${{ inputs.maven_args }}"

      - name: Install parent POMs
        if: inputs.test_mode != 'dry'
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      - name: "Platform: build"
        run: |
          SKIP_VERIFY=true bash docs/run-with-progress.sh --parallel "platform" mvn install -T 1C -f platform/pom.xml -pl '!memory-simulation-core' $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20

      - name: Validate produced JARs
        if: inputs.test_mode != 'dry'
        run: |
          BAD=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::error::Corrupt JAR produced: $jar"
              BAD=$((BAD + 1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          if [ "$BAD" -gt 0 ]; then exit 1; fi

      - name: Upload platform artifacts
        if: inputs.test_mode != 'dry'
        uses: actions/upload-artifact@v4
        with:
          name: m2-L0-platform
          path: ~/.m2/repository/io/casehub
          retention-days: 1
          compression-level: 1

  # Levels 1-9: data-driven from pipeline.yaml via config job outputs.
  # Shared build steps live in .github/actions/build-level/action.yml.
  # To change repo assignments, edit docs/pipeline.yaml — matrices are
  # computed at runtime by docs/compute-matrices.py.

  level1:
    name: "L1: ${{ matrix.name }}"
    needs: [config, prepare]
    if: always() && !cancelled() && (inputs.resume_from == '' || inputs.resume_from == 'L1')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l1 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l1 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L1
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}

  level2:
    name: "L2: ${{ matrix.name }}"
    needs: [config, prepare, level1]
    if: always() && !cancelled() && (needs.level1.result == 'success' || inputs.resume_from == 'L2')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l2 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L2
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}

  level3:
    name: "L3: ${{ matrix.name }}"
    needs: [config, prepare, level2]
    if: always() && !cancelled() && (needs.level2.result == 'success' || inputs.resume_from == 'L3')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l3 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l3 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L3
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}

  level4:
    name: "L4: ${{ matrix.name }}"
    needs: [config, prepare, level3]
    if: always() && !cancelled() && (needs.level3.result == 'success' || inputs.resume_from == 'L4')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l4 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L4
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}

  level5:
    name: "L5: ${{ matrix.name }}"
    needs: [config, prepare, level4]
    if: always() && !cancelled() && needs.level4.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l5 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L5
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}
          maven-extra: ${{ matrix.maven_extra }}

  level6:
    name: "L6: ${{ matrix.name }}"
    needs: [config, prepare, level5]
    if: always() && !cancelled() && needs.level5.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l6 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l6 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L6
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}
          pom-overrides: ${{ matrix.pom_overrides || '{}' }}

  level7:
    name: "L7: ${{ matrix.name }}"
    needs: [config, prepare, level6]
    if: always() && !cancelled() && (needs.level6.result == 'success' || inputs.resume_from == 'L7')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l7 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l7 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L7
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}
          maven-extra: ${{ matrix.maven_extra }}

  level8:
    name: "L8: ${{ matrix.name }}"
    needs: [config, prepare, level7]
    if: always() && !cancelled() && needs.level7.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(needs.config.outputs.timeouts).l8 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrices).l8 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/build-level
        with:
          repos: ${{ matrix.repos }}
          level: L9
          name: ${{ matrix.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-token: ${{ secrets.GH_PAT }}
          dashboard-token: ${{ secrets.CI_DASHBOARD_TOKEN }}
          mvn-common: ${{ needs.config.outputs.mvn-common }}
          maven-args: ${{ needs.config.outputs.maven-args }}

  # Finalize — dashboard + pointer advance
  finalize:
    name: "Finalize"
    needs: [config, prepare, level1, level2, level3, level4, level5, level6, level7, level8]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Update submodules
        run: bash docs/update-submodules.sh "${{ inputs.submodule_update }}" "${{ inputs.submodule_list }}"
        timeout-minutes: 5
      - name: Compute build result
        id: result
        if: always()
        run: |
          BUILD_OK=true
          for result in "${{ needs.prepare.result }}" "${{ needs.level1.result }}" "${{ needs.level2.result }}" "${{ needs.level3.result }}" "${{ needs.level4.result }}" "${{ needs.level5.result }}" "${{ needs.level6.result }}" "${{ needs.level7.result }}" "${{ needs.level8.result }}"; do
            if [ "$result" = "failure" ]; then
              BUILD_OK=false
              break
            fi
          done
          echo "build_ok=$BUILD_OK" >> "$GITHUB_OUTPUT"
          echo "Build result: $BUILD_OK"
      - name: Finalize CI dashboard
        if: always()
        run: |
          if [ "${{ steps.result.outputs.build_ok }}" = "true" ]; then
            bash docs/update-progress.sh finish success || true
          else
            bash docs/update-progress.sh finish failure || true
          fi
      - name: Advance submodule pointers
        if: steps.result.outputs.build_ok == 'true'
        run: |
          git checkout HEAD -- agency workers
          git add -u
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git pull --rebase origin main || true
            git push
          }
      - name: Download all build artifacts for cache
        if: steps.result.outputs.build_ok == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: "m2-*"
          path: ~/.m2/repository/io/casehub
          merge-multiple: true
      - name: Save casehub snapshot cache
        if: steps.result.outputs.build_ok == 'true'
        uses: actions/cache/save@v4
        with:
          # Cached casehub SNAPSHOTs from successful builds. Resume builds
          # restore this instead of purging+downloading — avoids 30+ min
          # GitHub Packages SNAPSHOT metadata resolution.
          path: ~/.m2/repository/io/casehub
          key: m2-casehub-${{ runner.os }}-${{ github.sha }}
      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ steps.result.outputs.build_ok }}" = "true" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Auto-retry on transient failure
        if: steps.result.outputs.build_ok != 'true' && inputs.retry_count < 2
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          JOB_RESULTS: >-
            level8=${{ needs.level8.result }}
            level8=${{ needs.level8.result }}
            level7=${{ needs.level7.result }}
            level6=${{ needs.level6.result }}
            level5=${{ needs.level5.result }}
            level4=${{ needs.level4.result }}
            level3=${{ needs.level3.result }}
            level2=${{ needs.level2.result }}
            level1=${{ needs.level1.result }}
        run: bash docs/auto-retry.sh "${{ inputs.retry_count }}" "${{ inputs.test_mode }}" "${{ inputs.submodule_update }}" "${{ inputs.submodule_list }}"
