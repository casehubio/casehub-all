name: Maven All

on:
  workflow_dispatch:
    inputs:
      maven_args:
        description: "Extra Maven args (e.g. -DskipTests, -T 1C)"
        type: string
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Maven Reactor Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Update parent to latest main
        run: git submodule update --init --remote parent

      - name: Reconcile submodules from CSVs
        run: python3 scripts/reconcile-submodules.py

      - name: Update submodules to latest main
        run: git submodule update --init --remote --merge

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install parent POM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -N -f parent/pom.xml --batch-mode -q

      - name: Maven reactor build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -fae -f parent/aggregator.xml --batch-mode ${{ inputs.maven_args }}

      - name: Advance submodule pointers
        if: success()
        run: |
          git add -A
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git push
          }

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Args: \`${{ inputs.maven_args || 'none' }}\`_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
