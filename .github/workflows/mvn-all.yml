      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              [ -d "$repo" ] && git submodule update --remote "$repo"
            done
          fi
        timeout-minutes: 5
      - name: Compute build result
        id: result
        if: always()
        run: |
          BUILD_OK=true
          for result in "${{ needs.prepare.result }}" "${{ needs.convergence.result }}" "${{ needs.level1.result }}" "${{ needs.level2.result }}" "${{ needs.work-base.result }}" "${{ needs.work-slices.result }}" "${{ needs.engine-base.result }}" "${{ needs.engine-slices.result }}" "${{ needs.level5.result }}" "${{ needs.level6.result }}" "${{ needs.level7.result }}" "${{ needs.level8.result }}" "${{ needs.level9.result }}"; do
            if [ "$result" = "failure" ]; then
              BUILD_OK=false
              break
            fi
          done
          echo "build_ok=$BUILD_OK" >> "$GITHUB_OUTPUT"
          echo "Build result: $BUILD_OK"
      - name: Finalize CI dashboard
        if: always()
        run: |
          if [ "${{ steps.result.outputs.build_ok }}" = "true" ]; then
            bash docs/update-progress.sh finish success || true
          else
            bash docs/update-progress.sh finish failure || true
          fi
      - name: Advance submodule pointers
        if: steps.result.outputs.build_ok == 'true'
        run: |
          git checkout HEAD -- agency workers
          git add -u
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git pull --rebase origin main || true
            git push
          }
      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ steps.result.outputs.build_ok }}" = "true" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Auto-retry on transient failure
        if: steps.result.outputs.build_ok != 'true' && inputs.retry_count < 2
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          RETRY=$(( ${{ inputs.retry_count }} + 1 ))
          RESUME=$(python3 -c "
          import json, yaml
          try:
            progress = json.load(open('/tmp/progress.json'))
            phases = progress.get('current', {}).get('phases', [])
            failed = {p['name'] for p in phases if p.get('status') == 'failure'}
            if not failed:
              print('')
            else:
              pipeline = yaml.safe_load(open('docs/pipeline.yaml'))
              for lv in pipeline['levels']:
                if not lv.get('resume'): continue
                all_names = set()
                if 'base' in lv: all_names.add(lv['base'])
                for s in lv['stacks']:
                  all_names.update(s)
                if 'convergence' in lv: all_names.add(lv['convergence'])
                if failed & all_names:
                  print(lv['id']); break
              else:
                print('')
          except: print('')
          " 2>/dev/null)
          if [ -n "$RESUME" ]; then
            echo "::warning::Build failed at $RESUME (attempt $RETRY/2). Resuming from $RESUME."
          else
            echo "::warning::Build failed (attempt $RETRY/2). Full rebuild."
          fi
          gh workflow run mvn-all.yml \
            -f test_mode=${{ inputs.test_mode }} \
            -f submodule_update=${{ inputs.submodule_update }} \
            -f submodule_list="${{ inputs.submodule_list }}" \
            -f retry_count="$RETRY" \
            -f resume_from="$RESUME"
