name: Maven All

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "skip = compile only (no run), compile = compile only (no run), run = compile + run"
        type: choice
        options:
          - skip
          - compile
          - run
        default: skip
      quarkus_build:
        description: "Run Quarkus augmentation (produces runner JARs)"
        type: boolean
        default: false
      enforcer:
        description: "Run Maven enforcer plugin"
        type: boolean
        default: false
      maven_args:
        description: "Extra Maven args (escape hatch)"
        type: string
        default: ''
      resume_from:
        description: "Resume from group. Skips earlier groups — uses .m2 cache."
        type: choice
        options:
          - ''
          - g1
          - g2
          - g3
          - g4
          - g5
        default: ''
      submodule_update:
        description: "pinned = use committed SHAs, all = pull latest main for all repos, list = pull latest only for named repos"
        type: choice
        options:
          - pinned
          - all
          - list
        default: pinned
      submodule_list:
        description: "Comma-separated repo names to update (only when submodule_update=list)"
        type: string
        default: ''
      retry_count:
        description: "Auto-retry counter (0 = first attempt, max 2 retries)"
        type: number
        default: 0

permissions:
  contents: write
  packages: read
  actions: write

# ════════════════════════════════════════════════════════════════════
# Architecture: maximally parallel pipeline
#
#   prepare → platform-slices(4) → convergence → g1-repos(5)
#     → g2-domain → g3-parallel(work|drafthouse) → g3-engine
#     → g4-parallel(ras|langchain4j|workers) → g4-sequential(agency→mosaic)
#     → g5g6-apps → finalize
# ════════════════════════════════════════════════════════════════════

jobs:

  # ════════════════════════════════════════════════════════════════════
  # Phase 0: Prepare — checkout, submodule update, platform base
  # ════════════════════════════════════════════════════════════════════
  prepare:
    name: "Prepare + Platform base"
    if: inputs.resume_from == ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - name: Initialize CI dashboard
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WORKER="${CI_DASHBOARD_URL}"
          OLD=$(curl -sf "$WORKER/progress" 2>/dev/null || echo '{}')
          python3 -c "
          import json, sys
          old = json.loads(sys.argv[1])
          data = {
            'current': {'run_id': ${GITHUB_RUN_ID}, 'run_url': '$RUN_URL',
                        'commit': '${GITHUB_SHA:0:7}', 'started': '$NOW',
                        'resume_from': '${{ inputs.resume_from }}' or None,
                        'retry_count': ${{ inputs.retry_count || 0 }},
                        'phases': [
                          {'name': 'Prepare + Platform base', 'status': 'in_progress', 'started': '$NOW'},
                        ] + [{'name': p, 'status': 'pending'} for p in [
                          'Platform A','Platform B','Platform C','Platform D',
                          'Platform convergence',
                          'G1: worker','G1: ledger','G1: connectors','G1: neocortex','G1: pages',
                          'G2: eidos, qhorus',
                          'G3: work','G3: drafthouse',
                          'G3: engine',
                          'G4: ras','G4: langchain4j','G4: workers',
                          'G4: agency-mosaic',
                          'App: iot','App: quarkmind',
                          'App: soc','App: claudony','App: clinical',
                          'App: devtown','App: aml','App: chat-app',
                          'App: life','App: openclaw','App: desiredstate',
                          'App: ops',
                          'App: scaffold','App: fsitrading']]},
            'history': old.get('history', []),
            '_archives': old.get('_archives', [])
          }
          print(json.dumps(data, indent=2))
          " "$OLD" | curl -sf -X PUT "$WORKER/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -H "X-Init: true" \
            -d @- > /dev/null
          echo "::notice::Dashboard: https://casehub.org/casehub-all/"
        env:
          CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
          CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dependency graph for cycles
        run: python3 docs/check-cycles.py

      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            echo "Updating ALL submodules to latest main"
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            echo "Updating parent + listed submodules: ${{ inputs.submodule_list }}"
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              if [ -d "$repo" ]; then
                echo "  Updating $repo"
                git submodule update --remote "$repo"
              else
                echo "  WARNING: $repo not found, skipping"
              fi
            done
          else
            echo "Using pinned submodule SHAs (committed pointers)"
          fi
        timeout-minutes: 5

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
          echo "::notice::MVN_COMMON=$FLAGS MAVEN_ARGS=${{ inputs.maven_args }}"

      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      - name: "Platform: base (3 modules)"
        run: bash docs/run-with-progress.sh --parallel "Prepare + Platform base" mvn install -T 1C -f platform/aggregator-base.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 5

      - name: Validate produced JARs
        run: |
          BAD=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::error::Corrupt JAR produced: $jar"
              BAD=$((BAD + 1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          if [ "$BAD" -gt 0 ]; then exit 1; fi

      - name: Upload platform base .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-base
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1

      - name: Upload platform base Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-base
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 1: Platform slices — 4 parallel jobs
  # ════════════════════════════════════════════════════════════════════
  platform-slices:
    name: "Platform slice ${{ matrix.slice }}"
    if: inputs.resume_from == ''
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [a, b, c, d]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.prepare.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.prepare.outputs.maven-args }}
    steps:
      - name: Dashboard — slice ${{ matrix.slice }} started
        run: |
          PHASE_NAME="Platform $(echo ${{ matrix.slice }} | tr 'a-z' 'A-Z')"
          SAFE_NAME="${GITHUB_RUN_ID}-platform-$(echo ${{ matrix.slice }})"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-$SAFE_NAME" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"$PHASE_NAME\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download platform base artifacts
        uses: actions/download-artifact@v4
        with: { name: m2-platform-base, path: ~/.m2/repository/io/casehub }

      - name: "Build slice ${{ matrix.slice }}"
        run: |
          SLICE_NAME="Platform $(echo ${{ matrix.slice }} | tr 'a-z' 'A-Z')"
          bash docs/run-with-progress.sh --parallel "$SLICE_NAME" mvn install -T 1C -f platform/aggregator-slice-${{ matrix.slice }}.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 45

      - name: Upload slice .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-slice-${{ matrix.slice }}
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1
      - name: Upload slice Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-slice-${{ matrix.slice }}
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 2: Platform convergence — full rebuild from source
  # ════════════════════════════════════════════════════════════════════
  convergence:
    name: "Platform convergence"
    needs: [prepare, platform-slices]
    if: inputs.resume_from == ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - name: Dashboard — convergence started
        run: |
          curl -sf -X PUT "$CI_DASHBOARD_URL/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "$(curl -sf "$CI_DASHBOARD_URL/progress" | python3 -c "
          import json,sys,datetime
          d=json.load(sys.stdin)
          if d.get('current'):
            now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
            for p in d['current']['phases']:
              if p['name']=='Platform convergence':
                p['status']='in_progress'; p.setdefault('started',now); break
          print(json.dumps(d))
          ")" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-platform-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Download Jandex indexes
        uses: actions/download-artifact@v4
        with: { pattern: "jandex-platform-*", path: platform, merge-multiple: true }
      - name: Validate artifacts
        run: |
          CORRUPT=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::warning::Corrupt JAR (deleted): $jar"; rm -f "$jar"; CORRUPT=$((CORRUPT+1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          while IFS= read -r -d '' idx; do
            if [ ! -s "$idx" ] || ! python3 -c "f=open('$idx','rb');m=f.read(2);f.close();exit(0 if m==b'\\xca\\xfe' else 1)" 2>/dev/null; then
              echo "::warning::Corrupt Jandex (deleted): $idx"; rm -f "$idx"; CORRUPT=$((CORRUPT+1))
            fi
          done < <(find platform -name 'jandex.idx' -print0)
          if [ "$CORRUPT" -gt 0 ]; then echo "::warning::$CORRUPT corrupt artifact(s) deleted"; fi
      - name: "Platform: full rebuild (-DskipTests)"
        run: bash docs/run-with-progress.sh "Platform convergence" mvn install -T 1C -DskipTests -f platform/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload convergence artifacts
        uses: actions/upload-artifact@v4
        with: { name: m2-ecosystem-base, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 3: G1 repos — 5 parallel jobs
  # ════════════════════════════════════════════════════════════════════
  g1-repos:
    name: "G1: ${{ matrix.repo }}"
    needs: convergence
    if: inputs.resume_from == '' || inputs.resume_from == 'g1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [worker, ledger, connectors, neocortex, pages]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args }}
    steps:
      - name: Dashboard — G1 ${{ matrix.repo }} started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-${GITHUB_RUN_ID}-g1--${{ matrix.repo }}" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"G1: ${{ matrix.repo }}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Enable Corepack
        run: corepack enable
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download convergence artifacts
        if: inputs.resume_from == ''
        uses: actions/download-artifact@v4
        with: { name: m2-ecosystem-base, path: ~/.m2/repository/io/casehub }
      - name: "Build ${{ matrix.repo }}"
        run: |
          bash docs/run-with-progress.sh --parallel "G1: ${{ matrix.repo }}" mvn install -fae -T 1C -f ${{ matrix.repo }}/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 25
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: "m2-g1-${{ matrix.repo }}", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 4: G2 Domain — eidos → qhorus (sequential, single job)
  # ════════════════════════════════════════════════════════════════════
  g2-domain:
    name: "G2: eidos, qhorus"
    needs: [convergence, g1-repos]
    if: always() && !cancelled() && (needs.g1-repos.result == 'success' || inputs.resume_from == 'g2')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then FLAGS="$FLAGS -DskipTests"; fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then FLAGS="$FLAGS -Dquarkus.build.skip=true"; fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then FLAGS="$FLAGS -Denforcer.skip=true"; fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download convergence + G1 artifacts
        if: inputs.resume_from != 'g2'
        uses: actions/download-artifact@v4
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: "G2: eidos, qhorus (eidos, qhorus)"
        run: |
          bash docs/run-with-progress.sh "G2: eidos, qhorus" mvn install -fae -T 1C -f parent/aggregator-g2-domain.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload G2 artifacts
        uses: actions/upload-artifact@v4
        with: { name: m2-g2-domain, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 5: G3 parallel — work | drafthouse (both only need G2)
  # ════════════════════════════════════════════════════════════════════
  g3-parallel:
    name: "G3: ${{ matrix.repo }}"
    needs: [g2-domain]
    if: always() && !cancelled() && needs.g2-domain.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [work, drafthouse]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - name: Dashboard — G3 ${{ matrix.repo }} started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-${GITHUB_RUN_ID}-g3--${{ matrix.repo }}" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"G3: ${{ matrix.repo }}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Set up Node 22
        if: matrix.repo == 'drafthouse'
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Enable Corepack
        if: matrix.repo == 'drafthouse'
        run: corepack enable
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download G2 artifacts
        uses: actions/download-artifact@v4
        with: { name: m2-g2-domain, path: ~/.m2/repository/io/casehub }
      - name: "Build ${{ matrix.repo }}"
        run: |
          bash docs/run-with-progress.sh --parallel "G3: ${{ matrix.repo }}" mvn install -fae -T 1C -f ${{ matrix.repo }}/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 30
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: "m2-g3-${{ matrix.repo }}", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 6: G3 engine — needs work (sequential after g3-parallel)
  # ════════════════════════════════════════════════════════════════════
  g3-engine:
    name: "G3: engine"
    needs: [g2-domain, g3-parallel]
    if: always() && !cancelled() && needs.g3-parallel.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - name: Dashboard — G3 engine started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf "$CI_DASHBOARD_URL/progress" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if d.get('current'):
            for p in d['current']['phases']:
              if p['name']=='G3: engine': p['status']='in_progress'; p.setdefault('started','$NOW'); break
          print(json.dumps(d))
          " | curl -sf -X PUT "$CI_DASHBOARD_URL/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d @- > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download G2+G3 artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-g*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Download convergence artifacts
        uses: actions/download-artifact@v4
        with: { name: m2-ecosystem-base, path: ~/.m2/repository/io/casehub }
      - name: "Build engine"
        run: |
          bash docs/run-with-progress.sh "G3: engine" mvn install -fae -T 1C -f engine/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 45
      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with: { name: m2-g3-engine, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 7: G4 parallel — ras | langchain4j | workers
  # ════════════════════════════════════════════════════════════════════
  g4-parallel:
    name: "G4: ${{ matrix.repo }}"
    needs: [g2-domain, g3-engine]
    if: always() && !cancelled() && needs.g3-engine.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [ras, casehub-langchain4j, workers]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - name: Dashboard — G4 ${{ matrix.repo }} started
        run: |
          PHASE_NAME="G4: ${{ matrix.repo }}"
          SAFE_NAME="${GITHUB_RUN_ID}-g4--${{ matrix.repo }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-$SAFE_NAME" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"$PHASE_NAME\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download all prior artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: "Build ${{ matrix.repo }}"
        run: |
          bash docs/run-with-progress.sh --parallel "G4: ${{ matrix.repo }}" mvn install -fae -T 1C -f ${{ matrix.repo }}/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: "m2-g4-${{ matrix.repo }}", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 8: G4 sequential — agency → mosaic (need workers + engine)
  # ════════════════════════════════════════════════════════════════════
  g4-sequential:
    name: "G4: agency + mosaic"
    needs: [g2-domain, g4-parallel]
    if: always() && !cancelled() && needs.g4-parallel.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Enable Corepack
        run: corepack enable
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download all prior artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: "Build agency"
        run: |
          bash docs/run-with-progress.sh "G4: agency-mosaic" mvn install -fae -T 1C -f agency/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 15
      - name: "Build mosaic"
        run: |
          mvn install -fae -T 1C -f casehub-mosaic/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: m2-g4-agency-mosaic, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 9a: Apps wave 1 — independent apps (4 parallel)
  # ════════════════════════════════════════════════════════════════════
  apps-wave1:
    name: "Apps: ${{ matrix.name }}"
    needs: [g2-domain, g4-sequential]
    if: always() && !cancelled() && needs.g4-sequential.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iot
            repos: "iot"
          - name: quarkmind
            repos: "quarkmind"
          - name: bundle-a
            repos: "soc claudony clinical"
          - name: bundle-b
            repos: "devtown aml chat-app"
          - name: bundle-c
            repos: "life openclaw desiredstate"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - name: Dashboard — Apps ${{ matrix.name }} started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for repo in ${{ matrix.repos }}; do
            curl -sf -X PUT "$CI_DASHBOARD_URL/phase-${GITHUB_RUN_ID}-app--${repo}" \
              -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-Run-Id: ${GITHUB_RUN_ID}" \
              -d "{\"name\":\"App: ${repo}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null || true
          done
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Enable Corepack
        run: corepack enable
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download all prior artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: "Build ${{ matrix.name }}"
        run: |
          for repo in ${{ matrix.repos }}; do
            bash docs/run-with-progress.sh --parallel "App: ${repo}" mvn install -fae -T 1C -f ${repo}/pom.xml $MVN_COMMON $MAVEN_ARGS
          done
        timeout-minutes: 30
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: "m2-app-${{ matrix.name }}", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 9b: Apps wave 2 — ops (needs desiredstate from wave 1)
  # ════════════════════════════════════════════════════════════════════
  apps-wave2:
    name: "App: ops"
    needs: [g2-domain, apps-wave1]
    if: always() && !cancelled() && needs.apps-wave1.result == 'success'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - name: Dashboard — App ops started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-${GITHUB_RUN_ID}-app--ops" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"App: ops\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download all prior artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: "Build ops"
        run: |
          bash docs/run-with-progress.sh --parallel "App: ops" mvn install -fae -T 1C -f ops/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: "m2-app-ops", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Phase 9c: Apps wave 3 — scaffold + fsitrading (both need ops) + finalize
  # ════════════════════════════════════════════════════════════════════
  apps-wave3:
    name: "App: ${{ matrix.repo }}"
    needs: [g2-domain, apps-wave2]
    if: always() && !cancelled() && needs.apps-wave2.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [scaffold, fsitrading]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.g2-domain.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.g2-domain.outputs.maven-args }}
    steps:
      - name: Dashboard — App ${{ matrix.repo }} started
        run: |
          SAFE_NAME="${GITHUB_RUN_ID}-app--${{ matrix.repo }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-$SAFE_NAME" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"App: ${{ matrix.repo }}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download all prior artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: "Build ${{ matrix.repo }}"
        run: |
          bash docs/run-with-progress.sh --parallel "App: ${{ matrix.repo }}" mvn install -fae -T 1C -f ${{ matrix.repo }}/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 30

  # ════════════════════════════════════════════════════════════════════
  # Finalize — dashboard + pointer advance
  # ════════════════════════════════════════════════════════════════════
  finalize:
    name: "Finalize"
    needs: [prepare, convergence, g1-repos, g2-domain, g3-parallel, g3-engine, g4-parallel, g4-sequential, apps-wave1, apps-wave2, apps-wave3]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              [ -d "$repo" ] && git submodule update --remote "$repo"
            done
          fi
        timeout-minutes: 5

      # ── Finalize dashboard ──────────────────────────────────────────
      - name: Finalize CI dashboard
        if: always()
        run: |
          ALL_OK="${{ needs.apps-wave3.result }}"
          if [ "$ALL_OK" = "success" ]; then
            bash docs/update-progress.sh finish success || true
          else
            bash docs/update-progress.sh finish failure || true
          fi

      # ── Advance pointers ────────────────────────────────────────────
      - name: Advance submodule pointers
        if: success()
        run: |
          git add -u
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git pull --rebase origin main || true
            git push
          }

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Auto-retry on transient failure
        if: failure() && inputs.retry_count < 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETRY=$(( ${{ inputs.retry_count }} + 1 ))
          echo "::warning::Build failed. Auto-retrying (attempt $RETRY/2)"
          gh workflow run mvn-all.yml \
            -f test_mode=${{ inputs.test_mode }} \
            -f submodule_update=${{ inputs.submodule_update }} \
            -f submodule_list="${{ inputs.submodule_list }}" \
            -f resume_from="g5" \
            -f retry_count="$RETRY"
