    needs: [convergence, engine-base]
    if: always() && !cancelled() && needs.engine-base.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [a, b, c]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      DRY_RUN: ${{ inputs.test_mode == 'dry' }}
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common || needs.gate.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args || needs.gate.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with:
