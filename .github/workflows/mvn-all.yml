      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common || format('--batch-mode -ntp -Dquarkus.http.test-port=0{0}{1}{2}', (inputs.test_mode == 'skip' || inputs.test_mode == 'compile') && ' -DskipTests' || '', inputs.quarkus_build != 'true' && ' -Dquarkus.build.skip=true' || '', inputs.enforcer != 'true' && ' -Denforcer.skip=true' || '') }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args || inputs.maven_args }}
    steps:
      - name: Dashboard — L9 started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for repo in scaffold fsitrading; do
            curl -sf -X PUT "$CI_DASHBOARD_URL/phase-${GITHUB_RUN_ID}-${repo}" \
              -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-Run-Id: ${GITHUB_RUN_ID}" \
              -d "{\"name\":\"${repo}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null || true
          done
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != ''
        run: git submodule update --remote
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        if: inputs.resume_from == ''
        run: rm -rf ~/.m2/repository/io/casehub
      - run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        continue-on-error: ${{ inputs.resume_from != '' }}
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Build
        run: |
          for repo in scaffold fsitrading; do
            bash docs/run-with-progress.sh --parallel "$repo" mvn install -fae -T 1C -f $repo/pom.xml $MVN_COMMON $MAVEN_ARGS
          done
        timeout-minutes: 30

  # ════════════════════════════════════════════════════════════════════
  # Finalize — dashboard + pointer advance
  # ════════════════════════════════════════════════════════════════════
  finalize:
    name: "Finalize"
    needs: [prepare, convergence, level1, level2, level3, level4, level5, level6, level7, level8, level9]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != ''
        run: git submodule update --remote
      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              [ -d "$repo" ] && git submodule update --remote "$repo"
            done
          fi
        timeout-minutes: 5
      - name: Finalize CI dashboard
        if: always()
        run: |
          ALL_OK="${{ needs.level9.result }}"
          if [ "$ALL_OK" = "success" ]; then
            bash docs/update-progress.sh finish success || true
          else
            bash docs/update-progress.sh finish failure || true
          fi
      - name: Advance submodule pointers
        if: success()
        run: |
          git add -u
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git pull --rebase origin main || true
            git push
          }
      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Auto-retry on transient failure
        if: failure() && inputs.retry_count < 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RETRY=$(( ${{ inputs.retry_count }} + 1 ))
          echo "::warning::Build failed. Auto-retrying (attempt $RETRY/2)"
          gh workflow run mvn-all.yml \
            -f test_mode=${{ inputs.test_mode }} \
            -f submodule_update=${{ inputs.submodule_update }} \
            -f submodule_list="${{ inputs.submodule_list }}" \
            -f resume_from="L7" \
            -f retry_count="$RETRY"
