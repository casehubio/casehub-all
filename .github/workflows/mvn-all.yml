          bash docs/run-with-progress.sh --parallel "Work base" mvn install -fae -T 1C $SKIP_FLAG -f build/work-slices/aggregator-base.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - if: inputs.test_mode != 'dry'
        uses: actions/upload-artifact@v4
        with: { name: m2-L3-work-base, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  work-slices:
    name: "L3: Work ${{ matrix.slice }}"
    needs: [convergence, work-base]
    if: always() && !cancelled() && needs.work-base.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [a, b]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
