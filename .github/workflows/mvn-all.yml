name: Maven All

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "skip = no compile/run, compile = compile only, run = compile + run"
        type: choice
        options:
          - skip
          - compile
          - run
        default: skip
      quarkus_build:
        description: "Run Quarkus augmentation (produces runner JARs)"
        type: boolean
        default: false
      enforcer:
        description: "Run Maven enforcer plugin"
        type: boolean
        default: false
      maven_args:
        description: "Extra Maven args (escape hatch)"
        type: string
        default: ''
      resume_from:
        description: "Resume from group. Skips earlier groups — uses .m2 cache."
        type: choice
        options:
          - ''
          - g1
          - g3
          - g4
          - g5
        default: ''

permissions:
  contents: write
  packages: read

# ── Reusable env block (duplicated per job — YAML anchors don't work in GHA) ──
# GITHUB_TOKEN, GH_PACKAGES_TOKEN, MAVEN_OPTS are set per-job.

jobs:

  # ════════════════════════════════════════════════════════════════════
  # Phase 0: Prepare — checkout, submodule update, parent POMs, platform base
  # ════════════════════════════════════════════════════════════════════
  prepare:
    name: "Prepare + Platform base"
    if: inputs.resume_from == ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest main
        run: |
          git submodule update --remote parent
          git submodule update --remote
        timeout-minutes: 5

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ]; then
            FLAGS="$FLAGS -Dmaven.test.skip=true"
          elif [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
          echo "::notice::MVN_COMMON=$FLAGS MAVEN_ARGS=${{ inputs.maven_args }}"

      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      - name: "Platform: base (3 modules)"
        run: mvn install -T 1C -f platform/aggregator-base.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 5

      - name: Upload platform base .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-base
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1

      - name: Upload platform base Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-base
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 1: Platform slices — 4 parallel jobs, each with its own 2 CPUs
  # ════════════════════════════════════════════════════════════════════
  platform-slices:
    name: "Platform slice ${{ matrix.slice }}"
    if: inputs.resume_from == ''
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [a, b, c, d]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.prepare.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.prepare.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update platform to latest main
        run: git submodule update --remote platform
        timeout-minutes: 2

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      - name: Download platform base artifacts
        uses: actions/download-artifact@v4
        with:
          name: m2-platform-base
          path: ~/.m2/repository/io/casehub

      - name: "Build slice ${{ matrix.slice }}"
        run: mvn install -T 1C -f platform/aggregator-slice-${{ matrix.slice }}.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 45

      - name: Upload slice .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-slice-${{ matrix.slice }}
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1

      - name: Upload slice Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-slice-${{ matrix.slice }}
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phases 2-8: Convergence + G1-G6 ecosystem build
  # ════════════════════════════════════════════════════════════════════
  build:
    name: "Convergence + Ecosystem"
    needs: [prepare, platform-slices]
    if: always() && (needs.prepare.result == 'success' && needs.platform-slices.result == 'success' || inputs.resume_from != '')
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Update submodules to latest main
        run: |
          git submodule update --remote parent
          git submodule update --remote
        timeout-minutes: 5

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Configure Maven flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ]; then
            FLAGS="$FLAGS -Dmaven.test.skip=true"
          elif [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "::notice::MVN_COMMON=$FLAGS MAVEN_ARGS=${{ inputs.maven_args }}"

      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      # Download all platform artifacts from slice jobs
      - name: Download platform .m2 artifacts
        if: inputs.resume_from == ''
        uses: actions/download-artifact@v4
        with:
          pattern: m2-platform-*
          path: ~/.m2/repository/io/casehub
          merge-multiple: true

      - name: Download platform Jandex indexes
        if: inputs.resume_from == ''
        uses: actions/download-artifact@v4
        with:
          pattern: jandex-platform-*
          path: platform
          merge-multiple: true

      # ── Phase 2: Platform convergence ─────────────────────────────────
      - name: "Platform: convergence"
        if: inputs.resume_from == ''
        run: mvn install -T 1C -f platform/aggregator-convergence.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 10

      # ── Phase 3: G1 Core libs ─────────────────────────────────────────
      - name: "G1: Core libraries (worker, ledger, connectors, neocortex, pages)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1'
        run: mvn install -fae -T 1C -f parent/aggregator-g1-core-libs.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 25

      # ── Phase 4: G2 Domain ────────────────────────────────────────────
      - name: "G2: Domain (eidos, qhorus)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1'
        run: mvn install -fae -T 1C -f parent/aggregator-g2-domain.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20

      # ── Phase 5: G3 Middleware ────────────────────────────────────────
      - name: "G3: Middleware (work, engine, drafthouse)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1' || inputs.resume_from == 'g3'
        run: mvn install -fae -T 1C -f parent/aggregator-g3-middleware.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 60

      # ── Phase 6: G4 Extensions ───────────────────────────────────────
      - name: "G4: Extensions (ras, agency, langchain4j, mosaic, workers)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1' || inputs.resume_from == 'g3' || inputs.resume_from == 'g4'
        run: mvn install -fae -T 1C -f parent/aggregator-g4-extensions.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 45

      # ── Phase 7+8: G5+G6 Apps ────────────────────────────────────────
      - name: "G5+G6: Apps (independent, then chain)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1' || inputs.resume_from == 'g3' || inputs.resume_from == 'g4' || inputs.resume_from == 'g5'
        run: |
          mvn install -fae -T 1C -f parent/aggregator-g5-apps-independent.xml $MVN_COMMON $MAVEN_ARGS
          mvn install -fae -T 1C -f parent/aggregator-g6-apps-chain.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 60

      # ── Advance pointers ─────────────────────────────────────────────
      - name: Advance submodule pointers
        if: success()
        run: |
          git add -u
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git pull --rebase origin main || true
            git push
          }

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Quarkus build: \`${{ inputs.quarkus_build }}\` | Enforcer: \`${{ inputs.enforcer }}\` | Args: \`$MAVEN_ARGS\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
