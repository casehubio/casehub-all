      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      DRY_RUN: ${{ inputs.test_mode == 'dry' }}
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common || needs.gate.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args || needs.gate.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Init submodules
        if: inputs.test_mode != 'dry'
        run: git submodule update --init --depth=1 parent platform ${{ matrix.repo }}
      - name: Initialize dashboard (resume)
        if: inputs.resume_from != ''
        run: bash docs/init-dashboard.sh ${GITHUB_RUN_ID} "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "${GITHUB_SHA:0:7}" "${{ inputs.resume_from }}" ${{ inputs.retry_count || 0 }}
        continue-on-error: true
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != '' && inputs.submodule_update != 'pinned' && inputs.test_mode != 'dry'
        run: git submodule update --remote ${{ matrix.repo }}
      - if: inputs.test_mode != 'dry'
        uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - if: inputs.test_mode != 'dry'
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - if: inputs.test_mode != 'dry'
        run: corepack enable
      - if: inputs.test_mode != 'dry'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-
      - name: Purge casehub snapshots
        if: inputs.test_mode != 'dry'
        run: |
          # Preserve npm artifact containers — they don't change between levels
          mv ~/.m2/repository/io/casehub/casehub-pages-npm /tmp/casehub-pages-npm 2>/dev/null || true
          mv ~/.m2/repository/io/casehub/casehub-mosaic-npm /tmp/casehub-mosaic-npm 2>/dev/null || true
          rm -rf ~/.m2/repository/io/casehub
          mkdir -p ~/.m2/repository/io/casehub
          mv /tmp/casehub-pages-npm ~/.m2/repository/io/casehub/ 2>/dev/null || true
          mv /tmp/casehub-mosaic-npm ~/.m2/repository/io/casehub/ 2>/dev/null || true
      - if: inputs.test_mode != 'dry'
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download build artifacts
        if: inputs.test_mode != 'dry'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ inputs.resume_from != '' }}
        with: { pattern: "m2-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Build
        run: |
          SKIP_FLAG="${{ (inputs.test_mode == 'skip' || inputs.test_mode == 'compile') && '-DskipTests' || '' }}"
          bash docs/run-with-progress.sh --parallel "${{ matrix.repo }}" mvn install -fae -T 1C $SKIP_FLAG -f ${{ matrix.repo }}/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 35
      - if: inputs.test_mode != 'dry'
        uses: actions/upload-artifact@v4
        with: { name: "m2-L2-${{ matrix.repo }}", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Level 3: work — base → slices(2)
  # ════════════════════════════════════════════════════════════════════
  work-base:
    name: "L3: Work base"
