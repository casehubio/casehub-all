name: Maven All

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "skip = no compile/run, compile = compile only, run = compile + run"
        type: choice
        options:
          - skip
          - compile
          - run
        default: skip
      quarkus_build:
        description: "Run Quarkus augmentation (produces runner JARs)"
        type: boolean
        default: false
      enforcer:
        description: "Run Maven enforcer plugin"
        type: boolean
        default: false
      maven_args:
        description: "Extra Maven args (escape hatch)"
        type: string
        default: ''
      resume_from:
        description: "Resume from group (e.g. g3). Skips earlier groups — uses .m2 cache."
        type: string
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Maven Reactor Build
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Update parent to latest main
        run: git submodule update --remote parent

      - name: Reconcile submodules from CSVs
        run: python3 scripts/reconcile-submodules.py

      - name: Update all submodules to latest main
        run: git submodule update --remote

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      # ── Assemble MVN_COMMON from inputs ──────────────────────────────
      - name: Configure Maven flags
        run: |
          FLAGS="--batch-mode -ntp"
          if [ "${{ inputs.test_mode }}" = "skip" ]; then
            FLAGS="$FLAGS -Dmaven.test.skip=true"
          elif [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "::notice::MVN_COMMON=$FLAGS ${{ inputs.maven_args }}"

      # ── Phase 0: Install parent POMs ──────────────────────────────────
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      # ── Phase 1: Platform (4 parallel slices) ─────────────────────────
      - name: "Platform: base"
        if: inputs.resume_from == ''
        run: mvn install -T 1C -f platform/aggregator-base.xml $MVN_COMMON ${{ inputs.maven_args }}
        timeout-minutes: 5

      - name: "Platform: slices A/B/C/D in parallel"
        if: inputs.resume_from == ''
        run: |
          mvn install -T 1C -f platform/aggregator-slice-a.xml $MVN_COMMON ${{ inputs.maven_args }} 2>&1 | sed 's/^/[A] /' &
          PID_A=$!
          mvn install -T 1C -f platform/aggregator-slice-b.xml $MVN_COMMON ${{ inputs.maven_args }} 2>&1 | sed 's/^/[B] /' &
          PID_B=$!
          mvn install -T 1C -f platform/aggregator-slice-c.xml $MVN_COMMON ${{ inputs.maven_args }} 2>&1 | sed 's/^/[C] /' &
          PID_C=$!
          mvn install -T 1C -f platform/aggregator-slice-d.xml $MVN_COMMON ${{ inputs.maven_args }} 2>&1 | sed 's/^/[D] /' &
          PID_D=$!

          FAILED=0
          wait $PID_A || FAILED=$((FAILED + 1))
          wait $PID_B || FAILED=$((FAILED + 1))
          wait $PID_C || FAILED=$((FAILED + 1))
          wait $PID_D || FAILED=$((FAILED + 1))
          if [ $FAILED -gt 0 ]; then echo "::error::$FAILED platform slice(s) failed"; exit 1; fi
        timeout-minutes: 45

      - name: "Platform: convergence"
        if: inputs.resume_from == ''
        run: mvn install -T 1C -f platform/aggregator-convergence.xml $MVN_COMMON ${{ inputs.maven_args }}
        timeout-minutes: 10

      # ── Phase 2: Core libs + Domain (parallel) ────────────────────────
      - name: "G1+G2: Core libraries and domain (parallel)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1'
        run: |
          mvn install -fae -T 1C -f parent/aggregator-g1-core-libs.xml $MVN_COMMON ${{ inputs.maven_args }} 2>&1 | sed 's/^/[G1] /' &
          PID_G1=$!
          mvn install -fae -T 1C -f parent/aggregator-g2-domain.xml $MVN_COMMON ${{ inputs.maven_args }} 2>&1 | sed 's/^/[G2] /' &
          PID_G2=$!

          FAILED=0
          wait $PID_G1 || FAILED=$((FAILED + 1))
          wait $PID_G2 || FAILED=$((FAILED + 1))
          if [ $FAILED -gt 0 ]; then echo "::error::$FAILED group(s) failed"; exit 1; fi
        timeout-minutes: 30

      # ── Phase 3: Middleware ───────────────────────────────────────────
      - name: "G3: Middleware (work, engine, drafthouse)"
        if: inputs.resume_from == '' || inputs.resume_from == 'g1' || inputs.resume_from == 'g3'
        run: mvn install -fae -T 1C -f parent/aggregator-g3-middleware.xml $MVN_COMMON ${{ inputs.maven_args }}
        timeout-minutes: 45

      # ── Phase 4: Extensions ──────────────────────────────────────────
      - name: "G4: Extensions (ras, agency, langchain4j, mosaic, workers)"
        if: inputs.resume_from == '' || inputs.resume_from <= 'g4'
        run: mvn install -fae -T 1C -f parent/aggregator-g4-extensions.xml $MVN_COMMON ${{ inputs.maven_args }}
        timeout-minutes: 30

      # ── Phase 5: Apps ────────────────────────────────────────────────
      - name: "G5+G6: Apps (parallel independent, then chain)"
        if: inputs.resume_from == '' || inputs.resume_from <= 'g6'
        run: |
          mvn install -fae -T 1C -f parent/aggregator-g5-apps-independent.xml $MVN_COMMON ${{ inputs.maven_args }}
          mvn install -fae -T 1C -f parent/aggregator-g6-apps-chain.xml $MVN_COMMON ${{ inputs.maven_args }}
        timeout-minutes: 45

      # ── Advance pointers ─────────────────────────────────────────────
      - name: Advance submodule pointers
        if: success()
        run: |
          git add -A
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git push
          }

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Tests: \`${{ inputs.test_mode }}\` | Quarkus build: \`${{ inputs.quarkus_build }}\` | Enforcer: \`${{ inputs.enforcer }}\` | Args: \`${{ inputs.maven_args || 'none' }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
