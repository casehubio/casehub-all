name: Maven All

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "skip = compile only (no run), compile = compile only (no run), run = compile + run"
        type: choice
        options:
          - skip
          - compile
          - run
        default: skip
      quarkus_build:
        description: "Run Quarkus augmentation (produces runner JARs)"
        type: boolean
        default: false
      enforcer:
        description: "Run Maven enforcer plugin"
        type: boolean
        default: false
      maven_args:
        description: "Extra Maven args (escape hatch)"
        type: string
        default: ''
      resume_from:
        description: "Resume from level. Skips earlier levels — uses .m2 cache."
        type: choice
        options:
          - ''
          - L1
          - L2
          - L3
          - L5
          - L8
        default: ''
      submodule_update:
        description: "pinned = use committed SHAs, all = pull latest main for all repos, list = pull latest only for named repos"
        type: choice
        options:
          - pinned
          - all
          - list
        default: pinned
      submodule_list:
        description: "Comma-separated repo names to update (only when submodule_update=list)"
        type: string
        default: ''
      if_running:
        description: "If a build is already running: cancel_existing = stop it and start this one, abort = cancel this run instead"
        type: choice
        options:
          - abort
          - cancel_existing
        default: abort
      retry_count:
        description: "Auto-retry counter (0 = first attempt, max 2 retries)"
        type: number
        default: 0

concurrency:
  group: mvn-all
  cancel-in-progress: ${{ inputs.if_running == 'cancel_existing' }}

permissions:
  contents: write
  packages: read
  actions: write

# ════════════════════════════════════════════════════════════════════
# Architecture: dependency-optimized parallel pipeline (10 levels)
#
# L0:   prepare → platform-slices(4) → convergence
# L1:   [ledger→eidos] | connectors | worker
# L2:   neocortex | qhorus
# L3:   work
# L4:   engine
# L5:   [ras→desiredstate] | [claudony+agency] | [langchain4j+workers]
# L6:   ops | mosaic  (foundational for apps)
# L7:   drafthouse  (uses mosaic UI)
# L8:   life | iot | quarkmind | [devtown+aml+soc] | [chat-app+clinical+openclaw]  (apps)
# L9:   [scaffold+fsitrading]  (need ops)
# fin:  dashboard finish + pointer advance
# ════════════════════════════════════════════════════════════════════

jobs:

  # ════════════════════════════════════════════════════════════════════
  # Gate: abort this run if another is already in progress (default)
  # ════════════════════════════════════════════════════════════════════
  gate:
    name: "Concurrency gate"
    if: inputs.if_running == 'abort'
    runs-on: ubuntu-latest
    steps:
      - name: Check for in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IN_PROGRESS=$(gh api repos/${{ github.repository }}/actions/workflows/mvn-all.yml/runs \
            --jq '[.workflow_runs[] | select(.status == "in_progress" and .id != '${{ github.run_id }}')] | length')
          if [ "$IN_PROGRESS" -gt 0 ]; then
            echo "::error::Another mvn-all run is already in progress. This run will be cancelled (if_running=abort)."
            gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}
            sleep 5
            exit 1
          fi
          echo "No other runs in progress — proceeding."

  # ════════════════════════════════════════════════════════════════════
  # Dependency cache — download all third-party deps once, cache between runs
  # ════════════════════════════════════════════════════════════════════
  warm-cache:
    name: "Warm dependency cache"
    needs: [gate]
    if: ${{ !failure() && !cancelled() && inputs.resume_from == '' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-
      - name: Verify and complete dependencies
        id: download
        run: |
          START=$(date +%s)
          CACHE_SIZE_BEFORE=$(du -s ~/.m2/repository 2>/dev/null | cut -f1 || echo 0)
          echo "Cache restored — $(du -sh ~/.m2/repository 2>/dev/null | cut -f1 || echo '0'). Verifying completeness..."
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
          mvn validate -f platform/pom.xml --batch-mode -ntp -U -q 2>/dev/null || true
          mvn dependency:go-offline -f parent/pom.xml --batch-mode -ntp -U || true
          for repo in platform engine connectors agency work eidos neocortex qhorus pages ledger worker desiredstate ras workers claudony ops casehub-mosaic drafthouse iot chat-app openclaw devtown aml clinical life soc fsitrading quarkmind scaffold casehub-langchain4j; do
            if [ -f "$repo/pom.xml" ]; then
              ( mvn dependency:resolve dependency:resolve-plugins -f "$repo/pom.xml" --batch-mode -ntp -U -q 2>/dev/null; echo "  ✓ $repo" ) &
            fi
          done
          wait
          ELAPSED=$(( $(date +%s) - START ))
          CACHE_SIZE_AFTER=$(du -s ~/.m2/repository 2>/dev/null | cut -f1 || echo 0)
          DELTA=$(( CACHE_SIZE_AFTER - CACHE_SIZE_BEFORE ))
          echo "Dependencies verified — $(du -sh ~/.m2/repository | cut -f1) in ${ELAPSED}s (delta: ${DELTA}KB)"
          echo "elapsed=$ELAPSED" >> "$GITHUB_OUTPUT"
          echo "delta=$DELTA" >> "$GITHUB_OUTPUT"
      - name: Save dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
      - name: Restart build if cache was incomplete
        if: steps.download.outputs.delta > 10240 && steps.download.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "::warning::Cache grew by ${{ steps.download.outputs.delta }}KB (>10MB) — was incomplete. Restarting with warm cache."
          gh workflow run mvn-all.yml \
            -f test_mode=${{ inputs.test_mode }} \
            -f submodule_update=${{ inputs.submodule_update }} \
            -f submodule_list="${{ inputs.submodule_list }}"
          gh run cancel ${{ github.run_id }} --repo ${{ github.repository }}

  # ════════════════════════════════════════════════════════════════════
  # Phase 0: Prepare — checkout, submodule update, platform base
  # ════════════════════════════════════════════════════════════════════
  prepare:
    name: "Prepare + Platform base"
    needs: [gate]
    if: ${{ !failure() && !cancelled() && inputs.resume_from == '' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - name: Initialize CI dashboard
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WORKER="${CI_DASHBOARD_URL}"
          curl -sf "$WORKER/progress" 2>/dev/null > /tmp/old-progress.json || echo '{}' > /tmp/old-progress.json
          python3 -c "
          import json, sys
          from datetime import datetime, timezone
          old = json.load(open('/tmp/old-progress.json'))
          history = old.get('history', [])
          prev = old.get('current')
          if prev and prev.get('run_id'):
              started = prev.get('started', '$NOW')
              phases = prev.get('phases', [])
              entry = {
                  'run_id': prev.get('run_id'), 'run_url': prev.get('run_url'),
                  'commit': prev.get('commit'), 'conclusion': 'unknown',
                  'started': started, 'ended': '$NOW',
                  'total_tests': sum(p.get('tests_run', 0) for p in phases),
                  'total_modules': sum(p.get('modules', 0) for p in phases),
                  'phases': phases
              }
              failed = [p['name'] for p in phases if p.get('status') == 'failure']
              entry['conclusion'] = 'failure' if failed else ('success' if any(p.get('status') == 'success' for p in phases) else 'unknown')
              history.insert(0, entry)
          data = {
            'current': {'run_id': ${GITHUB_RUN_ID}, 'run_url': '$RUN_URL',
                        'commit': '${GITHUB_SHA:0:7}', 'started': '$NOW',
                        'resume_from': '${{ inputs.resume_from }}' or None,
                        'retry_count': ${{ inputs.retry_count || 0 }},
                        'phases': [
                          {'name': 'Prepare + Platform base', 'status': 'in_progress', 'started': '$NOW'},
                        ] + [{'name': p, 'status': 'pending'} for p in [
                          'Platform A','Platform B','Platform C','Platform D',
                          'Platform convergence',
                          'ledger','eidos','connectors','worker','pages',
                          'neocortex','qhorus',
                          'work',
                          'engine',
                          'ras','desiredstate','claudony','agency','casehub-langchain4j','workers',
                          'ops','casehub-mosaic',
                          'drafthouse',
                          'life','iot','quarkmind','devtown','aml','soc','chat-app','clinical','openclaw',
                          'scaffold','fsitrading']]},
            'history': history[:200],
            '_archives': old.get('_archives', [])
          }
          print(json.dumps(data, indent=2))
          " | curl -sf -X PUT "$WORKER/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -H "X-Init: true" \
            -d @- > /dev/null
          echo "::notice::Dashboard: https://casehub.org/casehub-all/"
        env:
          CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
          CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dependency graph for cycles
        run: python3 docs/check-cycles.py

      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            echo "Updating ALL submodules to latest main"
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            echo "Updating parent + listed submodules: ${{ inputs.submodule_list }}"
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              if [ -d "$repo" ]; then
                echo "  Updating $repo"
                git submodule update --remote "$repo"
              else
                echo "  WARNING: $repo not found, skipping"
              fi
            done
          else
            echo "Using pinned submodule SHAs (committed pointers)"
          fi
        timeout-minutes: 5

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-

      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -U -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
          echo "::notice::MVN_COMMON=$FLAGS MAVEN_ARGS=${{ inputs.maven_args }}"

      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      - name: "Platform: base (3 modules)"
        run: bash docs/run-with-progress.sh --parallel "Prepare + Platform base" mvn install -T 1C -f build/platform-slices/aggregator-base.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 5

      - name: Validate produced JARs
        run: |
          BAD=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::error::Corrupt JAR produced: $jar"
              BAD=$((BAD + 1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          if [ "$BAD" -gt 0 ]; then exit 1; fi

      - name: Upload platform base .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-base
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1

      - name: Upload platform base Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-base
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 1: Platform slices — 4 parallel jobs
  # ════════════════════════════════════════════════════════════════════
  platform-slices:
    name: "Platform slice ${{ matrix.slice }}"
    if: inputs.resume_from == ''
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [a, b, c, d]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.prepare.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.prepare.outputs.maven-args }}
    steps:

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 22
        uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download platform base artifacts
        uses: actions/download-artifact@v4
        with: { name: m2-platform-base, path: ~/.m2/repository/io/casehub }

      - name: "Build slice ${{ matrix.slice }}"
        run: |
          SLICE_NAME="Platform $(echo ${{ matrix.slice }} | tr 'a-z' 'A-Z')"
          bash docs/run-with-progress.sh --parallel "$SLICE_NAME" mvn install -T 1C -Dmaven.test.skip=true -f build/platform-slices/aggregator-slice-${{ matrix.slice }}.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 45

      - name: Upload slice .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-slice-${{ matrix.slice }}
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1
      - name: Upload slice Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-slice-${{ matrix.slice }}
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 2: Platform convergence — full rebuild from source
  # ════════════════════════════════════════════════════════════════════
  convergence:
    name: "Platform convergence"
    needs: [prepare, platform-slices]
    if: inputs.resume_from == ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Set up Java 22
        uses: actions/setup-java@v4
        with: { java-version: '22', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-deps-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-deps-${{ runner.os }}-
      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -U -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
      - name: Purge casehub snapshots
        run: |
          # Preserve npm artifact containers — they don't change between levels
          mv ~/.m2/repository/io/casehub/casehub-pages-npm /tmp/casehub-pages-npm 2>/dev/null || true
          mv ~/.m2/repository/io/casehub/casehub-mosaic-npm /tmp/casehub-mosaic-npm 2>/dev/null || true
          rm -rf ~/.m2/repository/io/casehub
          mkdir -p ~/.m2/repository/io/casehub
          mv /tmp/casehub-pages-npm ~/.m2/repository/io/casehub/ 2>/dev/null || true
          mv /tmp/casehub-mosaic-npm ~/.m2/repository/io/casehub/ 2>/dev/null || true
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-platform-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Download Jandex indexes
        uses: actions/download-artifact@v4
        with: { pattern: "jandex-platform-*", path: platform, merge-multiple: true }
      - name: Validate artifacts
        run: |
          CORRUPT=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::warning::Corrupt JAR (deleted): $jar"; rm -f "$jar"; CORRUPT=$((CORRUPT+1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          while IFS= read -r -d '' idx; do
            if [ ! -s "$idx" ] || ! python3 -c "f=open('$idx','rb');m=f.read(2);f.close();exit(0 if m==b'\\xca\\xfe' else 1)" 2>/dev/null; then
              echo "::warning::Corrupt Jandex (deleted): $idx"; rm -f "$idx"; CORRUPT=$((CORRUPT+1))
            fi
          done < <(find platform -name 'jandex.idx' -print0)
          if [ "$CORRUPT" -gt 0 ]; then echo "::warning::$CORRUPT corrupt artifact(s) deleted"; fi
      - name: "Platform: full rebuild (-DskipTests)"
        run: bash docs/run-with-progress.sh --parallel "Platform convergence" mvn install -T 1C -DskipTests -f platform/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload convergence artifacts
        uses: actions/upload-artifact@v4
        with: { name: m2-ecosystem-base, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Level 1: [ledger→eidos] | connectors | worker (3 parallel)
  # ════════════════════════════════════════════════════════════════════
  level1:
    name: "L1: ${{ matrix.name }}"
    needs: convergence
    if: always() && !cancelled() && (inputs.resume_from == '' || inputs.resume_from == 'L1')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ledger, eidos"
            repos: "ledger eidos"
          - name: connectors
            repos: connectors
          - name: worker, pages
            repos: worker pages
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common || format('--batch-mode -ntp -Dquarkus.http.test-port=0{0}{1}{2}{3}', (inputs.test_mode == 'skip' || inputs.test_mode == 'compile') && ' -DskipTests' || '', inputs.quarkus_build != 'true' && ' -Dquarkus.build.skip=true' || '', inputs.enforcer != 'true' && ' -Denforcer.skip=true' || '', (inputs.test_mode == 'compile') && ' -Dnative.provision.skip=true' || '') }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args || inputs.maven_args }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Initialize dashboard (resume)
        if: inputs.resume_from != ''
        run: |
          TMPDIR=$(mktemp -d)
          curl -sf "$CI_DASHBOARD_URL/progress" > "$TMPDIR/old.json" 2>/dev/null || echo '{}' > "$TMPDIR/old.json"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python3 -c "
