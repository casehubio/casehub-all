name: Maven All

on:
  workflow_dispatch:
    inputs:
      maven_args:
        description: "Extra Maven args (e.g. -Dmaven.test.skip=true)"
        type: string
        default: ''
      resume_from:
        description: "Resume apps from module (e.g. :casehub-openclaw-app). Skips foundation — uses .m2 cache."
        type: string
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  build:
    name: Maven Reactor Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Update parent to latest main
        run: git submodule update --remote parent

      - name: Reconcile submodules from CSVs
        run: python3 scripts/reconcile-submodules.py

      - name: Update all submodules to latest main
        run: git submodule update --remote

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install parent POM
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn install -N -f parent/pom.xml --batch-mode -q

      - name: Compile foundation (parallel, no augmentation)
        if: inputs.resume_from == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: '-Xmx4g'
        timeout-minutes: 25
        run: mvn install -fae -T 1C -f parent/aggregator-foundation.xml --batch-mode -DskipTests -Denforcer.skip=true -Dquarkus.build.skip=true -ntp ${{ inputs.maven_args }}

      - name: Build applications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_OPTS: '-Xmx4g'
        timeout-minutes: 20
        run: |
          RF=""
          if [ -n "${{ inputs.resume_from }}" ]; then
            RF="-rf ${{ inputs.resume_from }}"
          fi
          mvn install -fae -f parent/aggregator-apps.xml --batch-mode -Dmaven.test.skip=true -Denforcer.skip=true -ntp $RF ${{ inputs.maven_args }}

      - name: Advance submodule pointers
        if: success()
        run: |
          if [ -z "${{ inputs.resume_from }}" ]; then
            git add -A
          else
            git submodule status | awk '{print $2}' | while read mod; do
              grep -q "<module>../$mod" parent/aggregator-apps.xml && git add "$mod"
            done
          fi
          git diff --staged --quiet || {
            git commit -m "chore: advance pointers to verified main SHAs (mvn-all)"
            git push
          }

      - name: Build summary
        if: always()
        run: |
          {
            echo "# Maven All"
            echo ""
            echo "_$(date -u '+%Y-%m-%d %H:%M UTC') | Args: \`${{ inputs.maven_args || 'none' }}\` | Resume: \`${{ inputs.resume_from || 'none' }}\`_"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Reactor build passed — pointers advanced.**"
            else
              echo "❌ **Reactor build failed — pointers unchanged.**"
            fi
            echo ""
            echo "## SHA Manifest"
            echo '```'
            git submodule status | sort
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
