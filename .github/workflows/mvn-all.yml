name: Maven All

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "skip = compile only (no run), compile = compile only (no run), run = compile + run"
        type: choice
        options:
          - skip
          - compile
          - run
        default: skip
      quarkus_build:
        description: "Run Quarkus augmentation (produces runner JARs)"
        type: boolean
        default: false
      enforcer:
        description: "Run Maven enforcer plugin"
        type: boolean
        default: false
      maven_args:
        description: "Extra Maven args (escape hatch)"
        type: string
        default: ''
      resume_from:
        description: "Resume from level. Skips earlier levels — uses .m2 cache."
        type: choice
        options:
          - ''
          - L1
          - L2
          - L3
          - L5
          - L8
        default: ''
      submodule_update:
        description: "pinned = use committed SHAs, all = pull latest main for all repos, list = pull latest only for named repos"
        type: choice
        options:
          - pinned
          - all
          - list
        default: pinned
      submodule_list:
        description: "Comma-separated repo names to update (only when submodule_update=list)"
        type: string
        default: ''
      retry_count:
        description: "Auto-retry counter (0 = first attempt, max 2 retries)"
        type: number
        default: 0

permissions:
  contents: write
  packages: read
  actions: write

# ════════════════════════════════════════════════════════════════════
# Architecture: dependency-optimized parallel pipeline (10 levels)
#
# L0:   prepare → platform-slices(4) → convergence
# L1:   [ledger→eidos] | connectors | worker
# L2:   neocortex | qhorus
# L3:   work
# L4:   engine
# L5:   [ras→desiredstate] | [claudony+agency] | [langchain4j+workers]
# L6:   ops | mosaic  (foundational for apps)
# L7:   drafthouse  (uses mosaic UI)
# L8:   life | iot | quarkmind | [devtown+aml+soc] | [chat-app+clinical+openclaw]  (apps)
# L9:   [scaffold+fsitrading]  (need ops)
# fin:  dashboard finish + pointer advance
# ════════════════════════════════════════════════════════════════════

jobs:

  # ════════════════════════════════════════════════════════════════════
  # Phase 0: Prepare — checkout, submodule update, platform base
  # ════════════════════════════════════════════════════════════════════
  prepare:
    name: "Prepare + Platform base"
    if: inputs.resume_from == ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - name: Initialize CI dashboard
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          WORKER="${CI_DASHBOARD_URL}"
          OLD=$(curl -sf "$WORKER/progress" 2>/dev/null || echo '{}')
          python3 -c "
          import json, sys
          old = json.loads(sys.argv[1])
          data = {
            'current': {'run_id': ${GITHUB_RUN_ID}, 'run_url': '$RUN_URL',
                        'commit': '${GITHUB_SHA:0:7}', 'started': '$NOW',
                        'resume_from': '${{ inputs.resume_from }}' or None,
                        'retry_count': ${{ inputs.retry_count || 0 }},
                        'phases': [
                          {'name': 'Prepare + Platform base', 'status': 'in_progress', 'started': '$NOW'},
                        ] + [{'name': p, 'status': 'pending'} for p in [
                          'Platform A','Platform B','Platform C','Platform D',
                          'Platform convergence',
                          'ledger','eidos','connectors','worker','pages',
                          'neocortex','qhorus',
                          'work',
                          'engine',
                          'ras','desiredstate','claudony','agency','casehub-langchain4j','workers',
                          'ops','casehub-mosaic',
                          'drafthouse',
                          'life','iot','quarkmind','devtown','aml','soc','chat-app','clinical','openclaw',
                          'scaffold','fsitrading']]},
            'history': old.get('history', []),
            '_archives': old.get('_archives', [])
          }
          print(json.dumps(data, indent=2))
          " "$OLD" | curl -sf -X PUT "$WORKER/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -H "X-Init: true" \
            -d @- > /dev/null
          echo "::notice::Dashboard: https://casehub.org/casehub-all/"
        env:
          CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
          CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dependency graph for cycles
        run: python3 docs/check-cycles.py

      - name: Update submodules
        run: |
          if [ "${{ inputs.submodule_update }}" = "all" ]; then
            echo "Updating ALL submodules to latest main"
            git submodule update --remote parent
            git submodule update --remote
          elif [ "${{ inputs.submodule_update }}" = "list" ]; then
            echo "Updating parent + listed submodules: ${{ inputs.submodule_list }}"
            git submodule update --remote parent
            IFS=',' read -ra REPOS <<< "${{ inputs.submodule_list }}"
            for repo in "${REPOS[@]}"; do
              repo=$(echo "$repo" | xargs)
              if [ -d "$repo" ]; then
                echo "  Updating $repo"
                git submodule update --remote "$repo"
              else
                echo "  WARNING: $repo not found, skipping"
              fi
            done
          else
            echo "Using pinned submodule SHAs (committed pointers)"
          fi
        timeout-minutes: 5

      - name: Record SHA manifest
        run: |
          echo "::group::SHA manifest (pin these to reproduce this build)"
          git submodule status | sort
          echo "::endgroup::"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-

      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
          echo "::notice::MVN_COMMON=$FLAGS MAVEN_ARGS=${{ inputs.maven_args }}"

      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q

      - name: "Platform: base (3 modules)"
        run: bash docs/run-with-progress.sh --parallel "Prepare + Platform base" mvn install -T 1C -f platform/aggregator-base.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 5

      - name: Validate produced JARs
        run: |
          BAD=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::error::Corrupt JAR produced: $jar"
              BAD=$((BAD + 1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          if [ "$BAD" -gt 0 ]; then exit 1; fi

      - name: Upload platform base .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-base
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1

      - name: Upload platform base Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-base
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 1: Platform slices — 4 parallel jobs
  # ════════════════════════════════════════════════════════════════════
  platform-slices:
    name: "Platform slice ${{ matrix.slice }}"
    if: inputs.resume_from == ''
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [a, b, c, d]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.prepare.outputs.mvn-common }}
      MAVEN_ARGS: ${{ needs.prepare.outputs.maven-args }}
    steps:
      - name: Dashboard — slice ${{ matrix.slice }} started
        run: |
          PHASE_NAME="Platform $(echo ${{ matrix.slice }} | tr 'a-z' 'A-Z')"
          SAFE_NAME="${GITHUB_RUN_ID}-platform-$(echo ${{ matrix.slice }})"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-$SAFE_NAME" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"$PHASE_NAME\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download platform base artifacts
        uses: actions/download-artifact@v4
        with: { name: m2-platform-base, path: ~/.m2/repository/io/casehub }

      - name: "Build slice ${{ matrix.slice }}"
        run: |
          SLICE_NAME="Platform $(echo ${{ matrix.slice }} | tr 'a-z' 'A-Z')"
          bash docs/run-with-progress.sh --parallel "$SLICE_NAME" mvn install -T 1C -f platform/aggregator-slice-${{ matrix.slice }}.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 45

      - name: Upload slice .m2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m2-platform-slice-${{ matrix.slice }}
          path: ~/.m2/repository/io/casehub/casehub-platform*
          retention-days: 1
          compression-level: 1
      - name: Upload slice Jandex indexes
        uses: actions/upload-artifact@v4
        with:
          name: jandex-platform-slice-${{ matrix.slice }}
          path: platform/*/target/classes/META-INF/jandex.idx
          retention-days: 1
          compression-level: 0
          if-no-files-found: ignore

  # ════════════════════════════════════════════════════════════════════
  # Phase 2: Platform convergence — full rebuild from source
  # ════════════════════════════════════════════════════════════════════
  convergence:
    name: "Platform convergence"
    needs: [prepare, platform-slices]
    if: inputs.resume_from == ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
    outputs:
      mvn-common: ${{ steps.flags.outputs.mvn-common }}
      maven-args: ${{ steps.flags.outputs.maven-args }}
    steps:
      - name: Dashboard — convergence started
        run: |
          curl -sf -X PUT "$CI_DASHBOARD_URL/progress" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "$(curl -sf "$CI_DASHBOARD_URL/progress" | python3 -c "
          import json,sys,datetime
          d=json.load(sys.stdin)
          if d.get('current'):
            now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
            for p in d['current']['phases']:
              if p['name']=='Platform convergence':
                p['status']='in_progress'; p.setdefault('started',now); break
          print(json.dumps(d))
          ")" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != ''
        run: git submodule update --remote
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Configure Maven flags
        id: flags
        run: |
          FLAGS="--batch-mode -ntp -Dquarkus.http.test-port=0"
          if [ "${{ inputs.test_mode }}" = "skip" ] || [ "${{ inputs.test_mode }}" = "compile" ]; then
            FLAGS="$FLAGS -DskipTests"
          fi
          if [ "${{ inputs.quarkus_build }}" != "true" ]; then
            FLAGS="$FLAGS -Dquarkus.build.skip=true"
          fi
          if [ "${{ inputs.enforcer }}" != "true" ]; then
            FLAGS="$FLAGS -Denforcer.skip=true"
          fi
          echo "MVN_COMMON=$FLAGS" >> "$GITHUB_ENV"
          echo "MAVEN_ARGS=${{ inputs.maven_args }}" >> "$GITHUB_ENV"
          echo "mvn-common=$FLAGS" >> "$GITHUB_OUTPUT"
          echo "maven-args=${{ inputs.maven_args }}" >> "$GITHUB_OUTPUT"
      - name: Purge casehub snapshots
        if: inputs.resume_from == ''
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with: { pattern: "m2-platform-*", path: ~/.m2/repository/io/casehub, merge-multiple: true }
      - name: Download Jandex indexes
        uses: actions/download-artifact@v4
        with: { pattern: "jandex-platform-*", path: platform, merge-multiple: true }
      - name: Validate artifacts
        run: |
          CORRUPT=0
          while IFS= read -r -d '' jar; do
            if ! jar tf "$jar" > /dev/null 2>&1; then
              echo "::warning::Corrupt JAR (deleted): $jar"; rm -f "$jar"; CORRUPT=$((CORRUPT+1))
            fi
          done < <(find ~/.m2/repository/io/casehub -name '*.jar' -print0)
          while IFS= read -r -d '' idx; do
            if [ ! -s "$idx" ] || ! python3 -c "f=open('$idx','rb');m=f.read(2);f.close();exit(0 if m==b'\\xca\\xfe' else 1)" 2>/dev/null; then
              echo "::warning::Corrupt Jandex (deleted): $idx"; rm -f "$idx"; CORRUPT=$((CORRUPT+1))
            fi
          done < <(find platform -name 'jandex.idx' -print0)
          if [ "$CORRUPT" -gt 0 ]; then echo "::warning::$CORRUPT corrupt artifact(s) deleted"; fi
      - name: "Platform: full rebuild (-DskipTests)"
        run: bash docs/run-with-progress.sh "Platform convergence" mvn install -T 1C -DskipTests -f platform/pom.xml $MVN_COMMON $MAVEN_ARGS
        timeout-minutes: 20
      - name: Upload convergence artifacts
        uses: actions/upload-artifact@v4
        with: { name: m2-ecosystem-base, path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Level 1: [ledger→eidos] | connectors | worker (3 parallel)
  # ════════════════════════════════════════════════════════════════════
  level1:
    name: "L1: ${{ matrix.name }}"
    needs: convergence
    if: always() && !cancelled() && (inputs.resume_from == '' || inputs.resume_from == 'L1')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "ledger, eidos"
            repos: "ledger eidos"
          - name: connectors
            repos: connectors
          - name: worker, pages
            repos: worker pages
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common || format('--batch-mode -ntp -Dquarkus.http.test-port=0{0}{1}{2}', (inputs.test_mode == 'skip' || inputs.test_mode == 'compile') && ' -DskipTests' || '', inputs.quarkus_build != 'true' && ' -Dquarkus.build.skip=true' || '', inputs.enforcer != 'true' && ' -Denforcer.skip=true' || '') }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args || inputs.maven_args }}
    steps:
      - name: Dashboard — L1 started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for repo in ${{ matrix.repos }}; do
            SAFE="${GITHUB_RUN_ID}-${repo}"
            curl -sf -X PUT "$CI_DASHBOARD_URL/phase-$SAFE" \
              -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
              -H "Content-Type: application/json" \
              -H "X-Run-Id: ${GITHUB_RUN_ID}" \
              -d "{\"name\":\"${repo}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null || true
          done
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != ''
        run: git submodule update --remote
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Enable Corepack
        run: corepack enable
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
          restore-keys: m2-${{ runner.os }}-
      - name: Purge casehub snapshots
        if: inputs.resume_from == ''
        run: rm -rf ~/.m2/repository/io/casehub
      - name: Install parent POMs
        run: |
          mvn install -N -f parent/pom.xml --batch-mode -q
          mvn install -N -f platform/pom.xml --batch-mode -q
      - name: Download convergence artifacts
        if: inputs.resume_from == ''
        uses: actions/download-artifact@v4
        with: { name: m2-ecosystem-base, path: ~/.m2/repository/io/casehub }
      - name: Build
        run: |
          for repo in ${{ matrix.repos }}; do
            bash docs/run-with-progress.sh --parallel "$repo" mvn install -fae -T 1C -f $repo/pom.xml $MVN_COMMON $MAVEN_ARGS
          done
        timeout-minutes: 25
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: { name: "m2-L1-${{ matrix.name }}", path: ~/.m2/repository/io/casehub, retention-days: 1, compression-level: 1 }

  # ════════════════════════════════════════════════════════════════════
  # Level 2: neocortex | qhorus (2 parallel — both need eidos from L1)
  # ════════════════════════════════════════════════════════════════════
  level2:
    name: "L2: ${{ matrix.repo }}"
    needs: [convergence, level1]
    if: always() && !cancelled() && (needs.level1.result == 'success' || inputs.resume_from == 'L2')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [neocortex, qhorus]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
      CI_DASHBOARD_URL: https://casehub-ci-dashboard.casehub.workers.dev
      CI_DASHBOARD_TOKEN: ${{ secrets.CI_DASHBOARD_TOKEN }}
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAVEN_OPTS: '-Xmx4g'
      MVN_COMMON: ${{ needs.convergence.outputs.mvn-common || format('--batch-mode -ntp -Dquarkus.http.test-port=0{0}{1}{2}', (inputs.test_mode == 'skip' || inputs.test_mode == 'compile') && ' -DskipTests' || '', inputs.quarkus_build != 'true' && ' -Dquarkus.build.skip=true' || '', inputs.enforcer != 'true' && ' -Denforcer.skip=true' || '') }}
      MAVEN_ARGS: ${{ needs.convergence.outputs.maven-args || inputs.maven_args }}
    steps:
      - name: Dashboard — L2 ${{ matrix.repo }} started
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X PUT "$CI_DASHBOARD_URL/phase-${GITHUB_RUN_ID}-${{ matrix.repo }}" \
            -H "Authorization: Bearer $CI_DASHBOARD_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Run-Id: ${GITHUB_RUN_ID}" \
            -d "{\"name\":\"${{ matrix.repo }}\",\"status\":\"in_progress\",\"started\":\"$NOW\"}" > /dev/null
        continue-on-error: true
      - uses: actions/checkout@v4
        with: { submodules: recursive, token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Pull latest submodules (resume)
        if: inputs.resume_from != ''
        run: git submodule update --remote
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', server-id: github, server-username: GITHUB_ACTOR, server-password: GITHUB_TOKEN }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
