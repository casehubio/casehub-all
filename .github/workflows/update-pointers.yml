name: Sync submodule pointers

on:
  repository_dispatch:
    types: [ecosystem-build-succeeded]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Update submodule pointers to build SHAs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Write updater script
        env:
          TRIGGER: ${{ github.event.client_payload.trigger || 'manual' }}
          SHAS_JSON: ${{ toJson(github.event.client_payload.shas) }}
          REPOS_JSON: ${{ toJson(github.event.client_payload.repos) }}
        run: |
          cat > /tmp/update_pointers.py << 'SCRIPT_END'
          import subprocess, os, sys, json, configparser

          raw_shas = os.environ.get("SHAS_JSON", "{}")
          raw_repos = os.environ.get("REPOS_JSON", "{}")

          if not raw_shas or raw_shas == "null":
              print("No SHAs in payload — nothing to update.")
              sys.exit(0)

          shas = json.loads(raw_shas) if isinstance(raw_shas, str) else raw_shas
          repos = json.loads(raw_repos) if isinstance(raw_repos, str) else raw_repos

          if not repos:
              repos = {}

          # Read current .gitmodules to find existing submodules
          existing = {}
          gitmodules = ".gitmodules"
          if os.path.exists(gitmodules):
              cfg = configparser.ConfigParser()
              cfg.read(gitmodules)
              for section in cfg.sections():
                  if section.startswith('submodule "'):
                      name = section[len('submodule "'):-1]
                      path = cfg.get(section, 'path', fallback=name)
                      url = cfg.get(section, 'url', fallback='')
                      existing[name] = {'path': path, 'url': url}

          updated = []
          added = []
          removed = []

          # Determine the desired set of submodules from the repos payload
          desired = set(repos.keys()) if repos else set()

          # Add missing submodules
          for name, url in repos.items():
              if name not in existing:
                  path = name
                  subprocess.run(
                      ["git", "config", "-f", gitmodules,
                       f"submodule.{name}.path", path], check=True)
                  subprocess.run(
                      ["git", "config", "-f", gitmodules,
                       f"submodule.{name}.url", url], check=True)
                  # SHA key uses underscores (name.replace('-', '_'))
                  sha_key = name.replace("-", "_")
                  sha = shas.get(sha_key, shas.get(name, ""))
                  if sha:
                      subprocess.run(
                          ["git", "update-index", "--add",
                           "--cacheinfo", f"160000,{sha},{path}"],
                          check=True)
                  added.append(f"  + {name}: {url}")

          # Remove submodules not in desired set (only when repos payload is present)
          if desired:
              for name, info in existing.items():
                  if name not in desired:
                      subprocess.run(
                          ["git", "config", "-f", gitmodules,
                           "--remove-section", f"submodule.{name}"],
                          check=True)
                      subprocess.run(
                          ["git", "update-index", "--remove", info['path']],
                          check=True)
                      removed.append(f"  - {name}")

          # Update SHA pointers for existing submodules
          for name, sha in shas.items():
              if not sha:
                  continue
              # SHA keys use underscores, paths use hyphens
              path = name.replace("_", "-")
              if path in existing or path in repos:
                  try:
                      subprocess.run(
                          ["git", "update-index", "--cacheinfo",
                           f"160000,{sha},{path}"],
                          check=True)
                      updated.append(f"  {path}: {sha[:12]}")
                  except subprocess.CalledProcessError:
                      print(f"  WARNING: {path} not a submodule — skipping")

          # Stage .gitmodules if it changed
          if added or removed:
              subprocess.run(["git", "add", gitmodules], check=True)

          diff = subprocess.run(["git", "diff", "--staged", "--quiet"])
          if diff.returncode == 0:
              print("All pointers already at these SHAs — no commit needed.")
              sys.exit(0)

          trigger = os.environ.get("TRIGGER", "workflow_dispatch")
          lines = []
          if added:
              lines.append("Added:\n" + "\n".join(added))
          if removed:
              lines.append("Removed:\n" + "\n".join(removed))
          if updated:
              lines.append("Updated:\n" + "\n".join(updated))
          detail = "\n\n".join(lines)
          msg = f"chore: sync to build-all ({trigger})\n\n{detail}"
          subprocess.run(["git", "commit", "-m", msg], check=True)
          subprocess.run(["git", "push"], check=True)

          summary = []
          if added:
              summary.append(f"{len(added)} added")
          if removed:
              summary.append(f"{len(removed)} removed")
          if updated:
              summary.append(f"{len(updated)} updated")
          print(f"Done: {', '.join(summary)}.")
          SCRIPT_END

      - name: Run updater
        env:
          TRIGGER: ${{ github.event.client_payload.trigger || 'manual' }}
          SHAS_JSON: ${{ toJson(github.event.client_payload.shas) }}
          REPOS_JSON: ${{ toJson(github.event.client_payload.repos) }}
        run: python3 /tmp/update_pointers.py
