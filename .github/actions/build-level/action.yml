name: 'Build Level'
description: 'Shared build steps for a casehub-all pipeline level'

inputs:
  repos:
    description: 'Space-separated list of repos to build'
    required: true
  level:
    description: 'Level identifier (L1, L2, etc.) for artifact naming'
    required: true
  name:
    description: 'Display name for dashboard and artifact naming'
    required: true
  github-token:
    description: 'GitHub token for checkout and packages'
    required: true
  gh-token:
    description: 'PAT for cross-repo operations'
    required: true
  dashboard-token:
    description: 'CI dashboard auth token'
    required: true
  mvn-common:
    description: 'Common Maven flags'
    required: true
  maven-args:
    description: 'Extra Maven args from workflow dispatch'
    default: ''
  pom-overrides:
    description: 'JSON dict of repo→pom path overrides'
    default: '{}'
  maven-extra:
    description: 'Extra Maven args for this matrix entry'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Init submodules
      if: github.event.inputs.test_mode != 'dry'
      shell: bash
      run: git submodule update --init --depth=1 parent platform ${{ inputs.repos }}

    - name: Pull latest submodules (resume)
      if: github.event.inputs.resume_from != '' && github.event.inputs.submodule_update != 'pinned' && github.event.inputs.test_mode != 'dry'
      shell: bash
      run: |
        REPOS="${{ inputs.repos }}"
        if [ -n "$REPOS" ]; then for repo in $REPOS; do git submodule update --remote "$repo"; done; fi

    - name: Set up Java 22
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/setup-java@v4
      with:
        java-version: '22'
        distribution: 'temurin'
        server-id: github
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Set up Node 22
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Enable Corepack
      if: github.event.inputs.test_mode != 'dry'
      shell: bash
      run: corepack enable

    - name: Restore Maven cache
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: m2-deps-${{ runner.os }}-${{ hashFiles('parent/pom.xml', 'platform/pom.xml') }}
        restore-keys: m2-deps-${{ runner.os }}-

    - name: Restore native library cache
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/cache@v4
      with:
        path: ~/.casehub
        key: casehub-native-${{ runner.os }}-sherpa
        restore-keys: casehub-native-${{ runner.os }}-

    - name: Install parent POMs
      if: github.event.inputs.test_mode != 'dry'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        mvn install -N -f parent/pom.xml --batch-mode -q
        mvn install -N -f platform/pom.xml --batch-mode -q

    - name: Download build artifacts
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/download-artifact@v4
      continue-on-error: ${{ github.event.inputs.resume_from != '' }}
      with:
        pattern: "m2-*"
        path: ~/.m2/repository/io/casehub
        merge-multiple: true

    - name: Restore casehub snapshot cache
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository/io/casehub
        key: m2-casehub-${{ runner.os }}-${{ github.sha }}
        restore-keys: m2-casehub-${{ runner.os }}-

    - name: Validate JARs
      if: github.event.inputs.test_mode != 'dry'
      shell: bash
      run: |
        python3 -c "
        import zipfile, os
        bad = 0
        for root, dirs, files in os.walk(os.path.expanduser('~/.m2/repository/io/casehub')):
            for f in files:
                if f.endswith('.jar'):
                    path = os.path.join(root, f)
                    try:
                        with zipfile.ZipFile(path) as z:
                            if z.testzip() is not None:
                                raise zipfile.BadZipFile('CRC mismatch')
                    except (zipfile.BadZipFile, Exception) as e:
                        print(f'::warning::Corrupt JAR (deleted): {path} — {e}')
                        os.remove(path)
                        bad += 1
        if bad: print(f'::warning::{bad} corrupt JAR(s) deleted — Maven will re-resolve from GitHub Packages')
        "

    - name: Snapshot before build
      if: github.event.inputs.test_mode != 'dry'
      shell: bash
      run: find ~/.m2/repository/io/casehub -type f \( -name '*.jar' -o -name '*.pom' \) > /tmp/m2-before.txt 2>/dev/null || touch /tmp/m2-before.txt

    - name: Build
      shell: bash
      env:
        MVN_COMMON: ${{ inputs.mvn-common }}
        MAVEN_ARGS: ${{ inputs.maven-args }}
        GH_TOKEN: ${{ inputs.gh-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_PACKAGES_TOKEN: ${{ inputs.github-token }}
        CI_DASHBOARD_TOKEN: ${{ inputs.dashboard-token }}
      run: |
        SKIP_FLAG=""
        TEST_MODE="${{ github.event.inputs.test_mode }}"
        if [ "$TEST_MODE" = "skip" ] || [ "$TEST_MODE" = "compile" ]; then
          SKIP_FLAG="-DskipTests"
        fi
        OVERRIDES='${{ inputs.pom-overrides }}'
        REPOS="${{ inputs.repos }}"
        REPO_COUNT=$(echo $REPOS | wc -w)
        for repo in $REPOS; do
          POM="$repo/pom.xml"
          if [ "$OVERRIDES" != "{}" ]; then
            OVERRIDE=$(echo "$OVERRIDES" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('$repo',''))" 2>/dev/null || true)
            if [ -n "$OVERRIDE" ]; then POM="$OVERRIDE"; fi
          fi
          # Use display name for single-repo entries where name differs (e.g. qhorus-api)
          PHASE_NAME="$repo"
          if [ "$REPO_COUNT" -eq 1 ] && [ "${{ inputs.name }}" != "$repo" ]; then
            PHASE_NAME="${{ inputs.name }}"
          fi
          bash docs/run-with-progress.sh --parallel "$PHASE_NAME" mvn install -fae -T 1C $SKIP_FLAG -f $POM $MVN_COMMON $MAVEN_ARGS ${{ inputs.maven-extra }}
        done

    - name: Collect new artifacts
      if: github.event.inputs.test_mode != 'dry'
      shell: bash
      run: |
        find ~/.m2/repository/io/casehub -type f \( -name '*.jar' -o -name '*.pom' \) > /tmp/m2-after.txt 2>/dev/null || touch /tmp/m2-after.txt
        mkdir -p /tmp/m2-upload
        comm -13 <(sort /tmp/m2-before.txt) <(sort /tmp/m2-after.txt) | while read f; do
          rel="${f#$HOME/.m2/repository/io/casehub/}"
          mkdir -p "/tmp/m2-upload/$(dirname "$rel")"
          cp "$f" "/tmp/m2-upload/$rel"
        done
        NEW=$(find /tmp/m2-upload -type f | wc -l)
        echo "::notice::Uploading $NEW new artifacts (was $(wc -l < /tmp/m2-before.txt) before, $(wc -l < /tmp/m2-after.txt) after)"

    - name: Upload artifacts
      if: github.event.inputs.test_mode != 'dry'
      uses: actions/upload-artifact@v4
      with:
        name: "m2-${{ inputs.level }}-${{ inputs.name }}"
        path: /tmp/m2-upload
        retention-days: 1
        compression-level: 1
        if-no-files-found: warn
