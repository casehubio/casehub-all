# Pipeline topology — single source of truth for the CI build.
# generate-workflow.py, dashboard, and resume options all derive from this.
#
# stacks: outer = parallel runners, inner = sequential phases per runner
# base:   optional phase before stacks fan out
# convergence: optional phase after all stacks complete
# resume: marks valid resume_from targets
# repos:  optional — repo directories when phase names don't match
#         (e.g. L0 phases are "Platform A" but the repo is "platform").
#         Omit when stack entries ARE directory names (most levels).
# slices: when set, generate-slices.py auto-assigns modules to N parallel
#         aggregator POMs at build time. Replaces static slice assignments.
#         Requires repos: [single-repo]. Base modules (depended on by others)
#         are assigned automatically — no manual base/slice split needed.
# timeout: build step timeout in minutes (default: 30)
# pom:    override POM path for a repo (default: $repo/pom.xml)
# maven_extra: per-repo extra Maven args (e.g. "-pl !npm-packages")
#
# Dashboard rendering rules (derived from structure):
#   base present        → base shown first, then fan-out to stacks
#   convergence present → convergence shown after stacks fan-in
#   3+ stacks           → rendered with fan connectors (visual spread)
#   2 stacks            → parallel, no fan connectors
#   1 stack             → single column

levels:
  - id: L0
    repos: [platform]
    slices: 4
    base: Prepare + Platform base
    stacks:
      - [Platform A]
      - [Platform B]
      - [Platform C]
      - [Platform D]
    convergence: Platform convergence

  - id: L1
    resume: true
    timeout: 35
    stacks:
      - [ledger, eidos]
      - [connectors]
      - [worker, pages]

  - id: L2
    resume: true
    timeout: 35
    stacks:
      - [neocortex]
      - [qhorus]

  - id: L3
    resume: true
    repos: [work]
    slices: 2
    base: Work base
    stacks:
      - [Work A]
      - [Work B]

  - id: L4
    resume: true
    repos: [engine]
    slices: 3
    base: Engine base
    stacks:
      - [Engine A]
      - [Engine B]
      - [Engine C]

  - id: L5
    resume: true
    timeout: 25
    stacks:
      - [ras, desiredstate]
      - [claudony]
      - [agency]
      - [casehub-langchain4j, workers]

  - id: L6
    timeout: 25
    maven_extra:
      casehub-mosaic: "-pl !npm-packages"
    stacks:
      - [ops]
      - [casehub-mosaic]

  - id: L7
    timeout: 25
    pom:
      drafthouse: drafthouse/server/pom.xml
    stacks:
      - [drafthouse]

  - id: L8
    resume: true
    stacks:
      - [life]
      - [iot]
      - [quarkmind]
      - [devtown, aml, soc]
      - [chat-app, clinical, openclaw]

  - id: L9
    stacks:
      - [scaffold, fsitrading]
