<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CaseHub CI Dashboard</title>
<style>
:root {
  --bg: #0d1117; --surface: #161b22; --surface2: #1c2128; --border: #30363d;
  --text: #e6edf3; --muted: #7d8590; --dim: #484f58;
  --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --grey: #6b7280; --blue: #3b82f6; --purple: #a855f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'SF Mono','Cascadia Code','Fira Code',monospace; font-size: 13px; padding: 20px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 18px; font-weight: 700; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.subtitle { color: var(--muted); font-size: 11px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
.card h2 { font-size: 11px; font-weight: 600; margin-bottom: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Run meta ── */
.run-meta { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; font-size: 12px; }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge.resume { background: rgba(245,158,11,0.2); color: var(--yellow); }
.badge.retry { background: rgba(239,68,68,0.2); color: var(--red); }

/* ── Pipeline ── */
.pipeline { display: flex; gap: 3px; flex-wrap: wrap; }
.phase { flex: 1; min-width: 70px; padding: 6px; border-radius: 6px; text-align: center; font-size: 10px; cursor: pointer; transition: transform 0.1s; }
.phase:hover { transform: scale(1.03); }
.phase .name { font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phase .info { color: var(--muted); font-size: 9px; line-height: 1.4; }
.phase.success { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); }
.phase.failure { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); }
.phase.in_progress { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.25); animation: pulse 2s ease-in-out infinite; }
.phase.pending { background: rgba(107,114,128,0.08); border: 1px solid rgba(107,114,128,0.15); color: var(--muted); }
.phase.skipped { background: rgba(107,114,128,0.04); border: 1px solid rgba(107,114,128,0.1); color: var(--dim); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ── Phase detail ── */
.detail-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-top: 8px; display: none; }
.detail-panel.open { display: block; }
.detail-panel h3 { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.detail-item { font-size: 11px; }
.detail-item .label { color: var(--muted); font-size: 9px; text-transform: uppercase; margin-bottom: 2px; }
.detail-list { list-style: none; font-size: 11px; }
.detail-list li { padding: 2px 0; display: flex; justify-content: space-between; }
.detail-list li .val { color: var(--muted); }

/* ── Stats cards ── */
.stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.stat { text-align: center; min-width: 80px; }
.stat .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
.stat .label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat .value.green { color: var(--green); }
.stat .value.red { color: var(--red); }
.stat .value.yellow { color: var(--yellow); }

/* ── Failure emphasis ── */
.card.failed-build { border-color: var(--red); background: rgba(239,68,68,0.06); }
.card.failed-build h2 { color: var(--red); }
.badge.failed { background: rgba(239,68,68,0.3); color: var(--red); font-size: 11px; padding: 3px 10px; }
.last-failure-banner { background: rgba(239,68,68,0.12); border: 2px solid var(--red); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; }
.last-failure-banner .icon { font-size: 24px; }
.last-failure-banner .msg { font-size: 13px; font-weight: 600; }
.last-failure-banner .detail { font-size: 11px; color: var(--muted); }
.phase.failure .name { color: var(--red); }
.phase.failure .fail-detail { color: var(--red); font-size: 9px; margin-top: 2px; font-weight: 600; }
.history .bar.failure { background: var(--red); position: relative; }
.history .bar.failure::after { content: '✕'; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 8px; color: var(--red); font-weight: 700; }

/* ── Charts ── */
.charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; }
.chart-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
.chart-card h3 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.chart-card svg { width: 100%; display: block; }

/* ── History table ── */
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th { text-align: left; color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
td { padding: 5px 8px; border-bottom: 1px solid rgba(48,54,61,0.5); }
tr:hover td { background: rgba(255,255,255,0.02); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.dot.success { background: var(--green); }
.dot.failure { background: var(--red); }

.no-data { color: var(--muted); text-align: center; padding: 20px; font-size: 12px; }
.refresh { color: var(--dim); font-size: 10px; text-align: right; margin-top: 6px; }

@media (max-width: 768px) {
  body { padding: 12px; }
  .pipeline { flex-direction: column; }
  .phase { min-width: 100%; }
  .charts { grid-template-columns: 1fr; }
  .stats { gap: 8px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>CaseHub CI</h1>
    <div class="subtitle">casehub-all reactor build dashboard</div>
  </div>
  <div class="subtitle" id="refresh-info"></div>
</div>

<!-- Last failure banner (shown when idle + last build failed) -->
<div id="last-failure-banner" class="last-failure-banner" style="display:none">
  <div class="icon">✕</div>
  <div>
    <div class="msg" id="failure-msg">Last build FAILED</div>
    <div class="detail" id="failure-detail"></div>
  </div>
</div>

<!-- Current Build -->
<div id="current-card" class="card" style="display:none">
  <h2>Current Build</h2>
  <div id="run-meta" class="run-meta"></div>
  <div id="pipeline" class="pipeline"></div>
  <div id="phase-detail" class="detail-panel"></div>
</div>
<div id="no-build" class="card" style="display:none">
  <div class="no-data">No build in progress</div>
</div>

<!-- Stats Overview -->
<div class="card">
  <h2>Overview (last 90 days)</h2>
  <div id="stats" class="stats"></div>
</div>

<!-- Trend Charts -->
<div id="charts-section" class="charts"></div>

<!-- History Table -->
<div class="card">
  <h2>Build History</h2>
  <div id="history-table"></div>
</div>

<script>
const GIST_RAW = 'https://gist.githubusercontent.com/mdproctor/2858101a4be664207373bf9491005f7d/raw/progress.json';
const BUST = () => `${GIST_RAW}?t=${Date.now()}`;

function fmt(s) {
  if (!s && s !== 0) return '—';
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return r > 0 ? `${m}m${r}s` : `${m}m`;
  const h = Math.floor(m / 60);
  return `${h}h${m % 60}m`;
}

function ago(started) {
  if (!started) return '';
  return fmt(Math.floor((Date.now() - new Date(started).getTime()) / 1000));
}

function shortDate(iso) {
  if (!iso) return '?';
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ── SVG Chart Helpers ──────────────────────────────────────────────

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function lineChart(container, data, opts = {}) {
  const { width = 300, height = 80, color = '#22c55e', label = '', showDots = true, dotColors = null, fill = false } = opts;
  if (!data.length) { container.innerHTML = '<div class="no-data">No data</div>'; return; }
  const pad = { t: 8, r: 8, b: 16, l: 8 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const maxY = Math.max(...data.map(d => d.y), 1);
  const minY = Math.min(...data.map(d => d.y), 0);
  const rangeY = maxY - minY || 1;
  const sx = i => pad.l + (i / Math.max(data.length - 1, 1)) * w;
  const sy = d => pad.t + h - ((d.y - minY) / rangeY) * h;

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}`, preserveAspectRatio: 'none' });

  // Grid lines
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + (h / 3) * i;
    svg.appendChild(svgEl('line', { x1: pad.l, y1: y, x2: width - pad.r, y2: y, stroke: '#30363d', 'stroke-width': '0.5' }));
  }

  // Path
  const pts = data.map((d, i) => `${sx(i)},${sy(d)}`);
  if (fill) {
    const fillPts = [`${sx(0)},${pad.t + h}`, ...pts, `${sx(data.length - 1)},${pad.t + h}`];
    svg.appendChild(svgEl('polygon', { points: fillPts.join(' '), fill: color, opacity: '0.15' }));
  }
  svg.appendChild(svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: color, 'stroke-width': '1.5', 'stroke-linejoin': 'round' }));

  // Dots
  if (showDots) {
    data.forEach((d, i) => {
      const c = dotColors ? (d.color || color) : color;
      svg.appendChild(svgEl('circle', { cx: sx(i), cy: sy(d), r: '2.5', fill: c }));
    });
  }

  // Label
  if (label) {
    const txt = svgEl('text', { x: pad.l, y: height - 2, fill: '#7d8590', 'font-size': '8', 'font-family': 'monospace' });
    txt.textContent = label;
    svg.appendChild(txt);
  }

  container.innerHTML = '';
  container.appendChild(svg);
}

function barChart(container, data, opts = {}) {
  const { width = 300, height = 80, color = '#22c55e', stacked = false } = opts;
  if (!data.length) { container.innerHTML = '<div class="no-data">No data</div>'; return; }
  const pad = { t: 8, r: 8, b: 16, l: 8 };
  const w = width - pad.l - pad.r, h = height - pad.t - pad.b;
  const maxY = Math.max(...data.map(d => stacked ? Object.values(d.values || {}).reduce((a, b) => a + b, 0) : d.y), 1);
  const barW = Math.max(2, w / data.length - 2);

  const svg = svgEl('svg', { viewBox: `0 0 ${width} ${height}` });
  for (let i = 0; i <= 3; i++) {
    const y = pad.t + (h / 3) * i;
    svg.appendChild(svgEl('line', { x1: pad.l, y1: y, x2: width - pad.r, y2: y, stroke: '#30363d', 'stroke-width': '0.5' }));
  }

  if (stacked) {
    const colors = { corrupt_jars_deleted: '#ef4444', corrupt_jandex_deleted: '#f59e0b', retries: '#a855f7' };
    data.forEach((d, i) => {
      const x = pad.l + (i / data.length) * w;
      let accum = 0;
      for (const [key, val] of Object.entries(d.values || {})) {
        const barH = (val / maxY) * h;
        svg.appendChild(svgEl('rect', { x, y: pad.t + h - accum - barH, width: barW, height: barH, fill: colors[key] || '#6b7280', rx: '1' }));
        accum += barH;
      }
    });
  } else {
    data.forEach((d, i) => {
      const x = pad.l + (i / data.length) * w;
      const barH = (d.y / maxY) * h;
      svg.appendChild(svgEl('rect', { x, y: pad.t + h - barH, width: barW, height: barH, fill: d.color || color, rx: '1' }));
    });
  }

  container.innerHTML = '';
  container.appendChild(svg);
}

// ── Render Functions ───────────────────────────────────────────────

let selectedPhase = null;

function renderLastFailureBanner(history) {
  const banner = document.getElementById('last-failure-banner');
  if (history && history.length > 0 && history[0].conclusion === 'failure') {
    const last = history[0];
    const failedPhases = (last.phases || []).filter(p => p.status === 'failure');
    const failedNames = failedPhases.map(p => p.name).join(', ') || 'unknown phase';
    banner.style.display = 'flex';
    document.getElementById('failure-msg').textContent = `Last build FAILED — ${failedNames}`;
    document.getElementById('failure-detail').innerHTML = `
      <a href="${last.run_url || '#'}" target="_blank">Run #${last.run_id}</a> · ${last.commit || ''} · ${shortDate(last.started)}
      ${last.total_flaky ? ` · <span style="color:var(--yellow)">${last.total_flaky} flaky</span>` : ''}
    `;
  } else {
    banner.style.display = 'none';
  }
}

function renderCurrent(current) {
  const card = document.getElementById('current-card');
  const noCard = document.getElementById('no-build');
  if (!current) { card.style.display = 'none'; noCard.style.display = 'block'; return; }
  card.style.display = 'block'; noCard.style.display = 'none';
  const hasFailure = current.phases.some(p => p.status === 'failure');
  card.className = hasFailure ? 'card failed-build' : 'card';

  document.getElementById('run-meta').innerHTML = `
    <a href="${current.run_url}" target="_blank">Run #${current.run_id}</a>
    <span style="color:var(--muted)">${current.commit || ''}</span>
    <span style="color:var(--muted)">${ago(current.started)} ago</span>
    ${hasFailure ? `<span class="badge failed">FAILED</span>` : ''}
    ${current.resume_from ? `<span class="badge resume">resumed from ${current.resume_from}</span>` : ''}
    ${current.retry_count > 0 ? `<span class="badge retry">retry #${current.retry_count}</span>` : ''}
  `;

  const pipeline = document.getElementById('pipeline');
  pipeline.innerHTML = current.phases.map((p, i) => {
    const dur = p.status === 'in_progress' ? ago(p.started) : p.duration_s != null ? fmt(p.duration_s) : '';
    const parts = [];
    if (p.modules) parts.push(`${p.modules} mod`);
    if (p.tests_run) parts.push(`${p.tests_run} tests`);
    if (p.tests_failed) parts.push(`<span style="color:var(--red)">${p.tests_failed} fail</span>`);
    if (p.tests_flaky) parts.push(`<span style="color:var(--yellow)">${p.tests_flaky} flaky</span>`);
    if (p.timeouts) parts.push(`<span style="color:var(--red)">${p.timeouts} hang</span>`);
    const sh = p.self_healing;
    const healed = sh && (sh.corrupt_jars_deleted || sh.corrupt_jandex_deleted || sh.retries);
    return `<div class="phase ${p.status}" onclick="toggleDetail(${i})" data-idx="${i}">
      <div class="name">${p.name}</div>
      <div class="info">${dur || '—'}</div>
      ${parts.length ? `<div class="info">${parts.join(' · ')}</div>` : ''}
      ${healed ? `<div class="info" style="color:var(--yellow)">🔧 healed</div>` : ''}
      ${p.status === 'failure' && p.failed_modules ? `<div class="fail-detail">${p.failed_modules.join(', ')}</div>` : ''}
      ${p.status === 'failure' && p.tests_failed ? `<div class="fail-detail">${p.tests_failed} test${p.tests_failed > 1 ? 's' : ''} failed</div>` : ''}
      ${p.status === 'failure' && p.timeouts ? `<div class="fail-detail">⏱ timeout</div>` : ''}
      ${p.status === 'failure' && healed ? `<div class="fail-detail">healed transients → still failed</div>` : ''}
    </div>`;
  }).join('');
}

function toggleDetail(idx) {
  const panel = document.getElementById('phase-detail');
  if (selectedPhase === idx) { panel.classList.remove('open'); selectedPhase = null; return; }
  selectedPhase = idx;

  const data = window._currentData;
  if (!data || !data.current) return;
  const p = data.current.phases[idx];
  if (!p) return;

  let html = `<h3>${p.name}</h3><div class="detail-grid">`;
  html += `<div class="detail-item"><div class="label">Status</div>${p.status}</div>`;
  html += `<div class="detail-item"><div class="label">Duration</div>${p.duration_s != null ? fmt(p.duration_s) : '—'}</div>`;
  html += `<div class="detail-item"><div class="label">Modules</div>${p.modules || '—'}</div>`;
  html += `<div class="detail-item"><div class="label">Tests</div>${p.tests_run || 0} run · ${p.tests_failed || 0} failed · ${p.tests_skipped || 0} skipped</div>`;
  if (p.tests_flaky) html += `<div class="detail-item"><div class="label">Flaky</div><span style="color:var(--yellow)">${p.tests_flaky}</span></div>`;
  if (p.timeouts) html += `<div class="detail-item"><div class="label">Timeouts</div><span style="color:var(--red)">${p.timeouts}</span></div>`;
  if (p.compilation_warnings) html += `<div class="detail-item"><div class="label">Warnings</div>${p.compilation_warnings}</div>`;
  if (p.deprecation_warnings) html += `<div class="detail-item"><div class="label">Deprecations</div>${p.deprecation_warnings}</div>`;
  if (p.quarkus_boots) html += `<div class="detail-item"><div class="label">Quarkus boots</div>${p.quarkus_boots.count} × avg ${p.quarkus_boots.avg_s}s (max ${p.quarkus_boots.max_s}s)</div>`;
  if (p.artifact_size_mb) html += `<div class="detail-item"><div class="label">Artifact size</div>${p.artifact_size_mb} MB</div>`;
  const sh = p.self_healing;
  if (sh) html += `<div class="detail-item"><div class="label">Self-healing</div>🔧 ${sh.corrupt_jars_deleted || 0} JARs · ${sh.corrupt_jandex_deleted || 0} Jandex · ${sh.retries || 0} retries</div>`;
  html += `</div>`;

  if (p.slowest_modules && p.slowest_modules.length) {
    html += `<div style="margin-top:10px"><div class="detail-item"><div class="label">Slowest modules</div></div><ul class="detail-list">`;
    p.slowest_modules.forEach(m => html += `<li><span>${m.name}</span><span class="val">${m.seconds}s</span></li>`);
    html += `</ul></div>`;
  }
  if (p.slowest_tests && p.slowest_tests.length) {
    html += `<div style="margin-top:10px"><div class="detail-item"><div class="label">Slowest tests</div></div><ul class="detail-list">`;
    p.slowest_tests.forEach(t => html += `<li><span>${t.test}</span><span class="val">${t.seconds}s</span></li>`);
    html += `</ul></div>`;
  }
  if (p.failed_modules && p.failed_modules.length) {
    html += `<div style="margin-top:10px"><div class="detail-item"><div class="label">Failed modules</div></div><ul class="detail-list">`;
    p.failed_modules.forEach(m => html += `<li style="color:var(--red)">${m}</li>`);
    html += `</ul></div>`;
  }

  panel.innerHTML = html;
  panel.classList.add('open');
}

function renderStats(history) {
  const el = document.getElementById('stats');
  if (!history || !history.length) { el.innerHTML = ''; return; }

  const n = history.length;
  const passed = history.filter(h => h.conclusion === 'success').length;
  const rate = Math.round((passed / n) * 100);
  const avgDur = Math.round(history.reduce((a, h) => a + (h.duration_s || 0), 0) / n);
  const avgTests = Math.round(history.reduce((a, h) => a + (h.total_tests || 0), 0) / n);
  const avgMod = Math.round(history.reduce((a, h) => a + (h.total_modules || 0), 0) / n);
  const totalFlaky = history.reduce((a, h) => a + (h.total_flaky || 0), 0);
  const totalWarnings = history.reduce((a, h) => a + (h.total_warnings || 0), 0);
  const totalHealing = history.reduce((a, h) => {
    const sh = h.self_healing || {};
    return a + (sh.corrupt_jars_deleted || 0) + (sh.corrupt_jandex_deleted || 0) + (sh.retries || 0);
  }, 0);
  const rc = rate >= 80 ? 'green' : rate >= 50 ? 'yellow' : 'red';

  el.innerHTML = `
    <div class="stat"><div class="value ${rc}">${rate}%</div><div class="label">Pass rate</div></div>
    <div class="stat"><div class="value">${fmt(avgDur)}</div><div class="label">Avg duration</div></div>
    <div class="stat"><div class="value">${n}</div><div class="label">Runs</div></div>
    <div class="stat"><div class="value green">${passed}</div><div class="label">Passed</div></div>
    <div class="stat"><div class="value red">${n - passed}</div><div class="label">Failed</div></div>
    <div class="stat"><div class="value">${avgTests.toLocaleString()}</div><div class="label">Avg tests</div></div>
    <div class="stat"><div class="value">${avgMod}</div><div class="label">Avg modules</div></div>
    ${totalFlaky ? `<div class="stat"><div class="value yellow">${totalFlaky}</div><div class="label">Total flakes</div></div>` : ''}
    ${totalWarnings ? `<div class="stat"><div class="value">${totalWarnings}</div><div class="label">Total warns</div></div>` : ''}
    ${totalHealing ? `<div class="stat"><div class="value yellow">${totalHealing}</div><div class="label">Self-heals</div></div>` : ''}
  `;
}

function renderCharts(history) {
  const el = document.getElementById('charts-section');
  if (!history || history.length < 2) { el.innerHTML = ''; return; }

  const runs = history.slice(0, 50).reverse();
  el.innerHTML = `
    <div class="chart-card"><h3>Build Duration</h3><div id="ch-dur"></div></div>
    <div class="chart-card"><h3>Test Count</h3><div id="ch-tests"></div></div>
    <div class="chart-card"><h3>Pass Rate (10-run rolling)</h3><div id="ch-rate"></div></div>
    <div class="chart-card"><h3>Flaky Tests</h3><div id="ch-flaky"></div></div>
    <div class="chart-card"><h3>Self-Healing Events</h3><div id="ch-heal"></div></div>
    <div class="chart-card"><h3>Warnings</h3><div id="ch-warn"></div></div>
  `;

  lineChart(document.getElementById('ch-dur'),
    runs.map((r, i) => ({ x: i, y: Math.round((r.duration_s || 0) / 60), color: r.conclusion === 'success' ? '#22c55e' : '#ef4444' })),
    { color: '#3b82f6', dotColors: true, label: 'minutes' });

  lineChart(document.getElementById('ch-tests'),
    runs.map((r, i) => ({ x: i, y: r.total_tests || 0 })),
    { color: '#a855f7', fill: true, showDots: false, label: 'tests' });

  // Rolling 10-run pass rate
  const rateData = [];
  for (let i = 0; i < runs.length; i++) {
    const window = runs.slice(Math.max(0, i - 9), i + 1);
    const p = window.filter(r => r.conclusion === 'success').length;
    rateData.push({ x: i, y: Math.round((p / window.length) * 100), color: p / window.length >= 0.8 ? '#22c55e' : p / window.length >= 0.5 ? '#f59e0b' : '#ef4444' });
  }
  barChart(document.getElementById('ch-rate'), rateData, { color: '#22c55e' });

  lineChart(document.getElementById('ch-flaky'),
    runs.map((r, i) => ({ x: i, y: r.total_flaky || 0 })),
    { color: '#f59e0b', label: 'flakes per run' });

  barChart(document.getElementById('ch-heal'),
    runs.map((r, i) => {
      const sh = r.self_healing || {};
      return { x: i, values: { corrupt_jars_deleted: sh.corrupt_jars_deleted || 0, corrupt_jandex_deleted: sh.corrupt_jandex_deleted || 0, retries: sh.retries || 0 } };
    }),
    { stacked: true });

  lineChart(document.getElementById('ch-warn'),
    runs.map((r, i) => ({ x: i, y: r.total_warnings || 0 })),
    { color: '#6b7280', fill: true, showDots: false, label: 'warnings' });
}

function renderHistoryTable(history) {
  const el = document.getElementById('history-table');
  if (!history || !history.length) { el.innerHTML = '<div class="no-data">No build history yet</div>'; return; }

  const rows = history.slice(0, 20).map(h => {
    const sh = h.self_healing || {};
    const healCount = (sh.corrupt_jars_deleted || 0) + (sh.corrupt_jandex_deleted || 0) + (sh.retries || 0);
    return `<tr>
      <td><span class="dot ${h.conclusion}"></span>${shortDate(h.started)}</td>
      <td><a href="${h.run_url || '#'}" target="_blank">${h.commit || '—'}</a></td>
      <td>${h.conclusion}</td>
      <td>${fmt(h.duration_s)}</td>
      <td>${(h.total_tests || 0).toLocaleString()}</td>
      <td>${h.total_modules || '—'}</td>
      <td>${h.total_flaky ? `<span style="color:var(--yellow)">${h.total_flaky}</span>` : '—'}</td>
      <td>${healCount ? `<span style="color:var(--yellow)">${healCount}</span>` : '—'}</td>
      <td>${h.resume_from ? `<span style="color:var(--yellow)">${h.resume_from}</span>` : '—'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table>
    <thead><tr><th>Date</th><th>Commit</th><th>Result</th><th>Duration</th><th>Tests</th><th>Modules</th><th>Flakes</th><th>Heals</th><th>Resumed</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function refresh() {
  try {
    const resp = await fetch(BUST());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    window._currentData = data;
    renderCurrent(data.current);
    if (!data.current) renderLastFailureBanner(data.history);
    else document.getElementById('last-failure-banner').style.display = 'none';
    renderStats(data.history);
    renderCharts(data.history);
    renderHistoryTable(data.history);
    document.getElementById('refresh-info').textContent = `${new Date().toLocaleTimeString()} · 30s`;
  } catch (e) {
    document.getElementById('refresh-info').textContent = `Error: ${e.message}`;
  }
}

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
